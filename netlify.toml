[build]
  command = "node scripts/build-static.mjs"
  publish = "dist"
  functions = "netlify/functions"

# ── URLs curtas (equivalente ao .htaccess/vercel.json, que o Netlify ignora) ──
# Sem estas regras, /master e /ponte serviam páginas "Carregando…" com noindex,
# e /participacao (endereço canônico da página) dava 404.
[[redirects]]
  from = "/master"
  to = "/teia-compliance-zero.html"
  status = 200
  force = true
[[redirects]]
  from = "/master/"
  to = "/teia-compliance-zero.html"
  status = 200
  force = true
[[redirects]]
  from = "/ponte"
  to = "/teia-ponte.html"
  status = 200
  force = true
[[redirects]]
  from = "/ponte/"
  to = "/teia-ponte.html"
  status = 200
  force = true
[[redirects]]
  from = "/participacao"
  to = "/participacao-civica.html"
  status = 200
[[redirects]]
  from = "/participacao/"
  to = "/participacao-civica.html"
  status = 200
[[redirects]]
  from = "/biblioteca"
  to = "/biblioteca.html"
  status = 200
[[redirects]]
  from = "/sobre"
  to = "/sobre.html"
  status = 200
[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
[[redirects]]
  from = "/jarro"
  to = "/jarro.html"
  status = 200
[[redirects]]
  from = "/mapa-dinastias"
  to = "/mapa-dinastias.html"
  status = 200
[[redirects]]
  from = "/mapa-magico"
  to = "/mapa-magico.html"
  status = 200
[[redirects]]
  from = "/investigacao-hub"
  to = "/investigacao-hub.html"
  status = 200

# www → domínio principal (evita conteúdo duplicado)
[[redirects]]
  from = "https://www.iuripiragibe.net/*"
  to = "https://iuripiragibe.net/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
  for = "/jornalismo/app.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
[[headers]]
  for = "/agora-slu/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/jornalismo"
  to = "/jornalismo/index.html"
  status = 200

[[redirects]]
  from = "/jornalismo/"
  to = "/jornalismo/index.html"
  status = 200

[[redirects]]
  from = "/jornalismo/aberto"
  to = "/jornalismo/app.html?v=aberto"
  status = 200

[[redirects]]
  from = "/jornalismo/aberto/"
  to = "/jornalismo/app.html?v=aberto"
  status = 200

[[redirects]]
  from = "/jornalismo/sala"
  to = "/jornalismo/app.html"
  status = 200

[[redirects]]
  from = "/jornalismo/content/aulas.json"
  to = "/jornalismo/"
  status = 404
  force = true

[[redirects]]
  from = "/jornalismo/downloads/*"
  to = "/jornalismo/"
  status = 404
  force = true

[[redirects]]
  from = "/api/create-pix"
  to = "/.netlify/functions/create-pix"
  status = 200

[[redirects]]
  from = "/api/create-preference"
  to = "/.netlify/functions/create-preference"
  status = 200

[[redirects]]
  from = "/api/webhook"
  to = "/.netlify/functions/webhook"
  status = 200

[[redirects]]
  from = "/api/check-payment"
  to = "/.netlify/functions/check-payment"
  status = 200

[[redirects]]
  from = "/api/oauth/callback"
  to = "/.netlify/functions/oauth-callback"
  status = 200

[[redirects]]
  from = "/api/test-email"
  to = "/.netlify/functions/test-email"
  status = 200

# ── Ágora (SLU) — API de integração com o Discord ──────────────────────
[[redirects]]
  from = "/api/agora/discord/sync"
  to = "/.netlify/functions/agora-discord-sync"
  status = 200

[[redirects]]
  from = "/api/agora/discord/channels"
  to = "/.netlify/functions/agora-discord-channels"
  status = 200

[[redirects]]
  from = "/api/agora/discord/messages"
  to = "/.netlify/functions/agora-discord-messages"
  status = 200

[[redirects]]
  from = "/api/agora/discord/role-webhook"
  to = "/.netlify/functions/agora-discord-role-webhook"
  status = 200

# Interactions Endpoint URL dos slash commands — configure esta URL completa
# (https://iuripiragibe.net/.netlify/functions/agora-discord-interactions)
# em Discord Developer Portal → General Information. Sem redirect próprio:
# o Discord exige o caminho exato /.netlify/functions/... para a verificação
# funcionar de forma previsível.

# Sincroniza os Scheduled Events do Discord a cada 10 minutos, sozinha.
[functions."agora-discord-events-sync"]
  schedule = "*/10 * * * *"





# PDFs pagos: impede indexação pelo Google (não substitui a proteção de acesso)
[[headers]]
  for = "/downloads/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
