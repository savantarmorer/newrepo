ct,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Dois entendimentos da CGU para citar</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><rect x="120" y="300" width="822" height="368" fill="#141416" stroke="#FFB800" stroke-width="3"/><rect x="120" y="300" width="822" height="10" fill="#FFB800"/><g transform="translate(148,336) scale(1.13)" fill="none" stroke="#FFB800" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5 H30 L38 13 V43 H12 Z M30 5 V13 H38 M18 22 H32 M18 29 H32 M18 36 H27" /></g><text x="808.4" y="370" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="44" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>2023</tspan></text><text x="148" y="442" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="40" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Enunciado 12</tspan></text><text x="148" y="502" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>É vedado negar acesso alegando “informações</tspan></text><text x="148" y="543.6" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>pessoais” de forma geral e abstrata. </tspan><tspan fill="#FFB800">O órgão</tspan></text><text x="148" y="585.2" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan fill="#FFB800">aponta o dado, tarja e entrega o resto.</tspan></text></g><g class="a up" style="--d:1.4s;--t:0.7s;"><rect x="978" y="300" width="822" height="368" fill="#141416" stroke="#FFB800" stroke-width="3"/><rect x="978" y="300" width="822" height="10" fill="#FFB800"/><g transform="translate(1006,336) scale(1.13)" fill="none" stroke="#FFB800" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="18"/><path d="M24 13 V24 L31 29" /></g><text x="1666.4" y="370" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="44" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>2024</tspan></text><text x="1006" y="442" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="40" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Portaria de setembro</tspan></text><text x="1006" y="502" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Restrição de informação pessoal sem prazo</tspan></text><text x="1006" y="543.6" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>indicado: </tspan><tspan fill="#FFB800">presumida em 15 anos.</tspan><tspan> Prazo maior</tspan></text><text x="1006" y="585.2" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>exige justificativa concreta.</tspan></text></g><g class="a up" style="--d:3.2s;--t:0.7s;"><text x="120" y="800" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="26" font-weight="700" fill="#FF6B5E" xml:space="preserve"><tspan>DOIS AVISOS</tspan></text></g><g class="a up" style="--d:3.5s;--t:0.7s;"><text x="120" y="850" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>A regra dos 15 anos é administrativa e vale só para o Executivo</tspan></text><text x="120" y="883.28" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>federal. Estados, municípios e outros Poderes têm regras</tspan></text><text x="120" y="916.56" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>próprias.</tspan></text></g><g class="a up" style="--d:3.9s;--t:0.7s;"><text x="1000" y="850" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>A CGU anunciou um projeto de lei para tirar o “até 100 anos” da</tspan></text><text x="1000" y="883.28" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>LAI. Na última checagem, não havia sido aprovado.</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>CGU, instância de recurso no governo federal</tspan></text></g></svg>