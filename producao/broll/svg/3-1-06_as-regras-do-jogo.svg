<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" data-dur="6.9" data-id="3.1-06"><style>@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Grotesk:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=block');.a{animation-duration:var(--t);animation-delay:var(--d);animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1)}.fade{animation-name:k-fade}.up{animation-name:k-up}.down{animation-name:k-down}.left{animation-name:k-left}.right{animation-name:k-right}.pop{animation-name:k-pop;transform-box:fill-box;transform-origin:center}.stamp{animation-name:k-stamp;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.3,1.4,.5,1)}.draw{animation-name:k-draw;stroke-dasharray:1;stroke-dashoffset:1;animation-timing-function:cubic-bezier(.6,0,.3,1)}.draw path,.draw line,.draw polyline,.draw rect,.draw circle{stroke-dasharray:1 1}.grow{animation-name:k-grow;transform-box:fill-box;transform-origin:left center}.growY{animation-name:k-growY;transform-box:fill-box;transform-origin:center bottom}.uncover{animation-name:k-uncover;transform-box:fill-box;transform-origin:right center;animation-timing-function:cubic-bezier(.7,0,.2,1)}.dim{animation-name:k-dim}.gone{animation-name:k-gone}.shake{animation-name:k-shake;animation-timing-function:linear}.drop{animation-name:k-drop;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.5,0,.9,.5)}.zoom{animation-name:k-zoom;transform-box:view-box;animation-timing-function:cubic-bezier(.6,0,.2,1)}.pulse{animation-name:k-pulse;transform-box:fill-box;transform-origin:center;animation-iteration-count:2}.slideL{animation-name:k-slideL}.slideR{animation-name:k-slideR}.spin{animation-name:k-spin;transform-box:view-box;animation-timing-function:linear}@keyframes k-fade{from{opacity:0}to{opacity:1}}@keyframes k-up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 3.1 · LAI: QUEM RESPONDE</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>As regras do jogo</tspan></text></g><g class="a up" style="--d:0.5s;--t:0.7s;"><rect x="120" y="313.52" width="64" height="44.88" fill="#FFB800"/><text x="135.63" y="346.96" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="27.28" font-weight="700" fill="#0C0C0D" xml:space="preserve"><tspan>01</tspan></text><text x="206" y="345.2" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Não precisa dizer o motivo.</tspan></text><text x="206" y="395.82" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan fill="#FFB800">Art. 10, §3º</tspan></text></g><g class="a up" style="--d:1.6s;--t:0.7s;"><rect x="120" y="456.84" width="64" height="44.88" fill="#FFB800"/><text x="135.63" y="490.28" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="27.28" font-weight="700" fill="#0C0C0D" xml:space="preserve"><tspan>02</tspan></text><text x="206" y="488.52" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>A exigência de identificação não pode inviabilizar o pedido.</tspan></text><text x="206" y="539.14" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan fill="#FFB800">Art. 10, §1º</tspan></text></g><g class="a up" style="--d:2.7s;--t:0.7s;"><rect x="120" y="600.16" width="64" height="44.88" fill="#FFB800"/><text x="135.63" y="633.6" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="27.28" font-weight="700" fill="#0C0C0D" xml:space="preserve"><tspan>03</tspan></text><text x="206" y="631.84" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>É gratuito. Só se cobra o custo de reprodução, quando houver.</tspan></text><text x="206" y="682.46" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan fill="#FFB800">Art. 12</tspan></text></g><g class="a up" style="--d:3.8s;--t:0.7s;"><rect x="120" y="743.48" width="64" height="44.88" fill="#FFB800"/><text x="135.63" y="776.92" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="27.28" font-weight="700" fill="#0C0C0D" xml:space="preserve"><tspan>04</tspan></text><text x="206" y="775.16" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Cada esfera tem sua regulamentação.</tspan></text><text x="206" y="825.78" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>No Executivo federal, o Decreto 7.724/2012, alterado em 2023 pelo Decreto 11.527. Estados e municípios têm</tspan></text><text x="206" y="864.78" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>normas próprias: </tspan><tspan fill="#FFB800">art. 45</tspan><tspan>.</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Lei 12.527/2011, a Lei de Acesso à Informação · regras válidas em setembro de 2026</tspan></text></g></svg>