}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 4.1 · DIÁRIOS OFICIAIS</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>O que procurar no diário</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><text x="120" y="269.6" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Ato administrativo só produz efeito quando é publicado. O poder é obrigado a deixar rastro.</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><rect x="120" y="400" width="399" height="390.44" fill="#141416" stroke="#FFB800" stroke-width="3"/><rect x="120" y="400" width="399" height="10" fill="#FFB800"/><g transform="translate(148,436) scale(1.13)" fill="none" stroke="#FFB800" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5 H30 L38 13 V43 H12 Z M30 5 V13 H38 M18 22 H32 M18 29 H32 M18 36 H27" /></g><text x="148" y="536.6" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="34" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Extratos de</tspan></text><text x="148" y="573.32" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="34" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>contrato</tspan></text><text x="148" y="630.44" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Quem contratou quem,</tspan></text><text x="148" y="669.44" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>por quanto, com base</tspan></text><text x="148" y="708.44" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>em quê.</tspan></text></g><g class="a up" style="--d:1.1s;--t:0.7s;"><rect x="547" y="400" width="399" height="390.44" fill="#141416" stroke="#FFB800" stroke-width="3"/