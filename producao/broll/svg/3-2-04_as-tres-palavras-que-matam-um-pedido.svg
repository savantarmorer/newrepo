}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 3.2 · O PEDIDO</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>As três palavras que matam um pedido</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><rect x="120" y="290" width="536" height="330" fill="#141416" stroke="#FF6B5E" stroke-width="3"/><rect x="120" y="290" width="536" height="10" fill="#FF6B5E"/><g transform="translate(148,326) scale(1.13)" fill="none" stroke="#FF6B5E" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8 L40 40 M40 8 L8 40" /></g><text x="148" y="428.4" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="36" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Genérico</tspan></text><text x="148" y="484.08" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Não dá para saber o que você quer.</tspan></text></g><g class="a up" style="--d:1.1s;--t:0.7s;"><rect x="692" y="290" width="536" height="330" fill="#141416" stroke="#FF6B5E" stroke-width="3"/><rect x="692" y="290" width="536" height="10" fill="#FF6B5E"/><g transform="translate(720,326) scale(1.13)" fill="none" stroke="#FF6B5E" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8 L40 40 M40 8 L8 40" /></g><text x="720" y="428.4" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="36" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Desproporcional</tspan></text><text x="720" y="484.08" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Você pede tanto que atender</tspan></text><text x="720" y="520.48" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>paralisaria o órgão.</tspan></text></g><g class="a up" style="--d:1.8s;--t:0.7s;"><rect x="1264" y="290" width="536" height="330" fill="#141416" stroke="#FF6B5E" stroke-width="3"/><rect x="1264" y="290" width="536" height="10" fill="#FF6B5E"/><g transform="translate(1292,326) scale(1.13)" fill="none" stroke="#FF6B5E" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8 L40 40 M40 8 L8 40" /></g><text x="1292" y="428.4" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="36" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Trabalho adicional</tspan></text><text x="1292" y="484.08" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Você pede que o órgão analise,</tspan></text><text x="1292" y="520.48" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>interprete ou consolide dados. Um</tspan></text><text x="1292" y="556.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>relatório que não existe.</tspan></text></g><g class="a fade" style="--d:2.8s;--t:0.7s;"><text x="120" y="700" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#4ADE80" letter-spacing="3.36" xml:space="preserve"><tspan>COMO FUGIR DAS TRÊS</tspan></text></g><g class="a pop" style="--d:3.1s;--t:0.6s;"><rect x="120" y="737.9" width="717.6" height="44.2" fill="none" stroke="#4ADE80" stroke-width="2.5"/><text x="135.6" y="769.36" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="26" font-weight="700" fill="#4ADE80" xml:space="preserve"><tspan>Recorte: período, unidade, tipo de documento</tspan></text></g><g class="a pop" style="--d:3.5s;--t:0.6s;"><rect x="861.6" y="737.9" width="483.6" height="44.2" fill="none" stroke="#4ADE80" stroke-width="2.5"/><text x="877.2" y="769.36" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="26" font-weight="700" fill="#4ADE80" xml:space="preserve"><tspan>Peça o dado “tal como existe”</tspan></text></g><g class="a pop" style="--d:3.9s;--t:0.6s;"><rect x="1369.2" y="737.9" width="405.6" height="44.2" fill="none" stroke="#4ADE80" stroke-width="2.5"/><text x="1384.8" y="769.36" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="26" font-weight="700" fill="#4ADE80" xml:space="preserve"><tspan>Aceite entrega em partes</tspan></text></g><g class="a up" style="--d:4.6s;--t:0.7s;"><text x="120" y="870" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>Trabalho adicional? O próprio decreto manda o órgão indicar </tspan><tspan fill="#FFB800">onde estão os dados brutos</tspan><tspan>, para você mesmo</tspan></text><text x="120" y="908.4" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>consolidar. Art. 13, parágrafo único.</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Decreto 7.724/2012, art. 13 · muitos estados e municípios copiaram a regra</tspan></text></g></svg>