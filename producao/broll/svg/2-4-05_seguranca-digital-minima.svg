}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 2.4 · SEGURANÇA</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Segurança digital mínima</tspan></text></g><g class="a up" style="--d:0.5s;--t:0.7s;"><rect x="120" y="300" width="35.2" height="35.2" fill="none" stroke="#66666F" stroke-width="3"/><text x="174.4" y="328.16" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>Verificação em duas etapas em tudo</tspan></text><text x="174.4" y="360.8" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="23.04" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>E-mail, redes, nuvem. Por aplicativo autenticador, não por SMS:</tspan></text><text x="174.4" y="390.29" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="23.04" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>chip pode ser clonado.</tspan></text></g><g class="a draw" style="--d:0.85s;--t:0.45s;"><path d="M126.336 318.304 L134.784 326.752 L150.272 307.744" stroke="#4ADE80" stroke-width="5.12" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g><g class="a up" style="--d:1.2s;--t:0.7s;"><rect x="120" y="433.9424" width="35.2" height="35.2" fill="none" stroke="#66666F" stroke-width="3"/><text x="174.4" y="462.1" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>Gerenciador de senhas</tspan></text><text x="174.4" y="494.74" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="23.04" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Uma senha diferente para cada serviço.</tspan></text></g><g class="a draw" style="--d:1.55s;--t:0.45s;"><path d="M126.336 452.2464 L134.784 460.69440000000003 L150.272 441.68640000000005" stroke="#4ADE80" stroke-width="5.12" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g><g class="a up" style="--d:1.9s;--t:0.7s;"><rect x="120" y="538.3936" width="35.2" height="35.2" fill="none" stroke="#66666F" stroke-width="3"/><text x="174.4" y="566.55" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>Disco do computador criptografado</tspan></text><text x="174.4" y="599.19" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="23.04" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>FileVault no Mac. BitLocker ou criptografia de dispositivo no</tspan></text><text x="174.4" y="628.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="23.04" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Windows.</tspan></text></g><g class="a draw" style="--d:2.25s;--t:0.45s;"><path d="M126.336 556.6976 L134.784 565.1456 L150.272 546.1376" stroke="#4ADE80" stroke-width="5.12" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g><g class="a up" style="--d:2.6s;--t:0.7s;"><rect x="990" y="300" width="35.2" height="35.2" fill="none" stroke="#66666F" stroke-width="3"/><text x="1044.4" y="328.16" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>Backup fora da nuvem pessoal</tspan></text><text x="1044.4" y="360.8" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="23.04" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Também criptografado.</tspan></text></g><g class="a draw" style="--d:2.95s;--t:0.45s;"><path d="M996.336 318.304 L1004.784 326.752 L1020.272 307.744" stroke="#4ADE80" stroke-width="5.12" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g><g class="a up" style="--d:3.3s;--t:0.7s;"><rect x="990" y="404.4512" width="35.2" height="35.2" fill="none" stroke="#66666F" stroke-width="3"/><text x="1044.4" y="432.61" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>Um e-mail só para a pauta</tspan></text><text x="1044.4" y="465.25" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="23.04" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>E, se possível, um número de telefone.</tspan></text></g><g class="a draw" style="--d:3.65s;--t:0.45s;"><path d="M996.336 422.75519999999995 L1004.784 431.2032 L1020.272 412.1952" stroke="#4ADE80" stroke-width="5.12" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g><g class="a up" style="--d:4s;--t:0.7s;"><rect x="990" y="508.90239999999994" width="35.2" height="35.2" fill="none" stroke="#66666F" stroke-width="3"/><text x="1044.4" y="537.06" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>Sistema atualizado</tspan></text><text x="1044.4" y="569.7" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="23.04" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>E desconfiança de link “do tribunal”, “da Receita” ou “do banco”</tspan></text><text x="1044.4" y="599.19" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="23.04" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>pedindo login: é phishing, pescaria de senha.</tspan></text></g><g class="a draw" style="--d:4.35s;--t:0.45s;"><path d="M996.336 527.2063999999999 L1004.784 535.6543999999999 L1020.272 516.6464" stroke="#4ADE80" stroke-width="5.12" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g></svg>