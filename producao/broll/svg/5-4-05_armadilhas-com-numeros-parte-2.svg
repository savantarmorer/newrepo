,Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>As duas frases são verdadeiras. Só</tspan></text><text x="1290" y="715.84" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>uma é honesta no contexto.</tspan></text></g></svg>