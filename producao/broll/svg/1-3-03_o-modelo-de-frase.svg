}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 1.3 · HIPÓTESE</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="190" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>O modelo de frase</tspan></text></g><g class="a up" style="--d:0.6s;--t:0.7s;"><rect x="120" y="250" width="1680" height="190" fill="#141416" stroke="#FFB800" stroke-width="3"/><text x="160" y="322" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="44" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan fill="#FFB800">[Agente]</tspan><tspan> fez </tspan><tspan fill="#FFB800">[ato]</tspan><tspan> com </tspan><tspan fill="#FFB800">[recurso público]</tspan><tspan>, gerando </tspan><tspan fill="#FFB800">[benefício</tspan></text><text x="160" y="381.4" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="44" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan fill="#FFB800">para alguém]</tspan><tspan>, e isso foi ocultado por </tspan><tspan fill="#FFB800">[meio]</tspan><tspan>.</tspan></text></g><g class="a fade" style="--d:1.8s;--t:0.7s;"><text x="120" y="510" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#FFB800" letter-spacing="3.36" xml:space="preserve"><tspan>EXEMPLO</tspan></text></g><g class="a up" style="--d:2s;--t:0.7s;"><text x="120" y="568" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="36" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>“A prefeitura de X contratou sem licitação uma empresa aberta seis meses antes, cujo sócio é</tspan></text><text x="120" y="614.8" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="36" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>assessor do vereador Y. O contrato foi publicado só como extrato, sem o processo.”</tspan></text></g><g class="a up" style="--d:3.4s;--t:0.7s;"><rect x="120" y="760" width="320" height="170" fill="#1C1C1F"/><rect x="120" y="760" width="320" height="8" fill="#FFB800"/><text x="140" y="814" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>AGENTE</tspan></text><text x="140" y="862" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>a prefeitura</tspan></text></g><g class="a up" style="--d:3.85s;--t:0.7s;"><rect x="460" y="760" width="320" height="170" fill="#1C1C1F"/><rect x="460" y="760" width="320" height="8" fill="#FFB800"/><text x="480" y="814" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>ATO</tspan></text><text x="480" y="862" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>contratar sem</tspan></text><text x="480" y="894.2" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>licitação</tspan></text></g><g class="a up" style="--d:4.3s;--t:0.7s;"><rect x="800" y="760" width="320" height="170" fill="#1C1C1F"/><rect x="800" y="760" width="320" height="8" fill="#FFB800"/><text x="820" y="814" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>RECURSO</tspan></text><text x="820" y="862" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>dinheiro do</tspan></text><text x="820" y="894.2" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>município</tspan></text></g><g class="a up" style="--d:4.75s;--t:0.7s;"><rect x="1140" y="760" width="320" height="170" fill="#1C1C1F"/><rect x="1140" y="760" width="320" height="8" fill="#FFB800"/><text x="1160" y="814" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>BENEFÍCIO</tspan></text><text x="1160" y="862" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>a empresa, e talvez</tspan></text><text x="1160" y="894.2" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>o vereador</tspan></text></g><g class="a up" style="--d:5.2s;--t:0.7s;"><rect x="1480" y="760" width="320" height="170" fill="#1C1C1F"/><rect x="1480" y="760" width="320" height="8" fill="#FFB800"/><text x="1500" y="814" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>OCULTAÇÃO</tspan></text><text x="1500" y="862" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>publicação mínima</tspan></text></g></svg>