span>.</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Conteúdo educativo. Não substitui advogado no caso concreto. Regras válidas em setembro de 2026.</tspan></text></g></svg>