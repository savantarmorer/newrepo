n></text></g><g class="a up" style="--d:4.4s;--t:0.7s;"><text x="120" y="760" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan fill="#FFB800">Dias corridos, não úteis.</tspan><tspan> Conta sábado, domingo e feriado.</tspan></text><rect x="120" y="800" width="30" height="30" fill="#232327"/><text x="164" y="825" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>fim de semana também conta</tspan></text></g><g class="a up" style="--d:5.2s;--t:0.7s;"><text x="120" y="910" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Se a informação estiver disponível, a regra é entregar na hora. Os 20 dias são o limite, não a meta.</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Lei 12.527/2011, a Lei de Acesso à Informação · regras válidas em setembro de 2026</tspan></text></g></svg>