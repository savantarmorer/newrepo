u Sans Mono',Menlo,monospace" font-size="22" font-weight="400" fill="#5B564C" xml:space="preserve"><tspan>Recebida em 13/09/2026, às 16h10</tspan></text></g><g class="a up" style="--d:1.2s;--t:0.7s;"><rect x="1080" y="260.68" width="35.7" height="35.7" fill="#4ADE80"/><g transform="translate(1084.76,265.44) scale(0.55)" fill="none" stroke="#0C0C0D" stroke-width="9.05" stroke-linecap="round" stroke-linejoin="round"><path d="M8 25 L19 36 L40 12" /></g><text x="1141.7" y="287.2" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Mostre a resposta de forma fiel.</tspan></text></g><g class="a up" style="--d:2s;--t:0.7s;"><rect x="1080" y="338.2" width="35.7" height="35.7" fill="#4ADE80"/><g transform="translate(1084.76,342.96) scale(0.55)" fill="none" stroke="#0C0C0D" stroke-width="9.05" stroke-linecap="round" stroke-linejoin="round"><path d="M8 25 L19 36 L40 12" /></g><text x="1141.7" y="364.72" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Não corte a parte que ajuda a pessoa</tspan></text><text x="1141.7" y="408.24" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>acusada.</tspan></text></g><g class="a up" style="--d:2.8s;--t:0.7s;"><rect x="1080" y="459.24" width="35.7" height="35.7" fill="#4ADE80"/><g transform="translate(1084.76,464) scale(0.55)" fill="none" stroke="#0C0C0D" stroke-width="9.05" stroke-linecap="round" stroke-linejoin="round"><path d="M8 25 L19 36 L40 12" /></g><text x="1141.7" y="485.76" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Longa demais? Resuma com</tspan></text><text x="1141.7" y="529.28" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight=