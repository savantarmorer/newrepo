}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 6.4 · ELEIÇÕES E PROTOCOLO</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Três cuidados no pedido</tspan></text></g><g class="a up" style="--d:0.5s;--t:0.7s;"><rect x="120" y="303.04" width="64" height="38.76" fill="#FFB800"/><text x="137.86" y="331.92" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="23.56" font-weight="700" fill="#0C0C0D" xml:space="preserve"><tspan>01</tspan></text><text x="206" y="330.4" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Não esconda o que vai publicar.</tspan></text><text x="206" y="376.44" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>O outro lado precisa saber do que se defende.</tspan></text></g><g class="a up" style="--d:1.4s;--t:0.7s;"><rect x="120" y="426.08" width="64" height="38.76" fill="#FFB800"/><text x="137.86" y="454.96" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="23.56" font-weight="700" fill="#0C0C0D" xml:space="preserve"><tspan>02</tspan></text><text x="206" y="453.44" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Não mande o documento original, se ele puder identificar a fonte.</tspan></text><text x="206" y="499.48" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Descreva.</tspan></text></g><g class="a pop" style="--d:2.4s;--t:0.6s;"><rect x="120" y="640" width="190" height="150" fill="#FF6B5E"/><text x="181.94" y="704" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="34" font-weight="400" fill="#0C0C0D" xml:space="preserve"><tspan>sex</tspan></text><text x="186.2" y="756" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" fon