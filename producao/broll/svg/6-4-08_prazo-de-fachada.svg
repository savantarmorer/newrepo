ont-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan fill="#FF6B5E">fachada</tspan><tspan>. E juiz percebe.</tspan></text></g><g class="a up" style="--d:4.6s;--t:0.7s;"><text x="1040" y="840" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Prazo razoável: </tspan><tspan fill="#FFB800">48 a 72 horas</tspan><tspan> para temas simples.</tspan></text><text x="1040" y="878.4" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Mais para temas complexos.</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Conteúdo educativo. Não substitui advogado no caso concreto. Regras válidas em setembro de 2026.</tspan></text></g></svg>