<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" data-dur="8.1" data-id="7.1-16"><style>@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Grotesk:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=block');.a{animation-duration:var(--t);animation-delay:var(--d);animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1)}.fade{animation-name:k-fade}.up{animation-name:k-up}.down{animation-name:k-down}.left{animation-name:k-left}.right{animation-name:k-right}.pop{animation-name:k-pop;transform-box:fill-box;transform-origin:center}.stamp{animation-name:k-stamp;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.3,1.4,.5,1)}.draw{animation-name:k-draw;stroke-dasharray:1;stroke-dashoffset:1;animation-timing-function:cubic-bezier(.6,0,.3,1)}.draw path,.draw line,.draw polyline,.draw rect,.draw circle{stroke-dasharray:1 1}.grow{animation-name:k-grow;transform-box:fill-box;transform-origin:left center}.growY{animation-name:k-growY;transform-box:fill-box;transform-origin:center bottom}.uncover{animation-name:k-uncover;transform-box:fill-box;transform-origin:right center;animation-timing-function:cubic-bezier(.7,0,.2,1)}.dim{animation-name:k-dim}.gone{animation-name:k-gone}.shake{animation-name:k-shake;animation-timing-function:linear}.drop{animation-name:k-drop;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.5,0,.9,.5)}.zoom{animation-name:k-zoom;transform-box:view-box;animation-timing-function:cubic-bezier(.6,0,.2,1)}.pulse{animation-name:k-pulse;transform-box:fill-box;transform-origin:center;animation-iteration-count:2}.slideL{animation-name:k-slideL}.slideR{animation-name:k-slideR}.spin{animation-name:k-spin;transform-box:view-box;animation-timing-function:linear}@keyframes k-fade{from{opacity:0}to{opacity:1}}@keyframes k-up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 7.1 · ESTRUTURA E ROTEIRO</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Pergunta aberta, honesta</tspan></text></g><g class="a draw" style="--d:0.4s;--t:0.8s;"><path d="M120 640 H1800" stroke="#232327" stroke-width="12" fill="none" pathLength="1"/></g><g class="a pop" style="--d:1s;--t:0.6s;"><circle cx="520" cy="640" r="16" fill="#FFB800"/></g><g class="a fade" style="--d:1s;--t:0.7s;"><text x="488.8" y="700" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="26" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>1:20</tspan></text></g><g class="a up" style="--d:1.3s;--t:0.7s;"><rect x="180" y="422.96" width="700" height="137.04" fill="#1C1C1F" stroke="#FFB800" stroke-width="2"/><text x="210" y="475.84" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>“Mas o contrato tinha uma cláusula</tspan></text><text x="210" y="519.36" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>que ninguém explicou. </tspan><tspan fill="#FFB800">Já chego nela.</tspan><tspan>”</tspan></text><path d="M500 550 L520 590 L540 550 Z" fill="#1C1C1F"/></g><g class="a draw" style="--d:2.6s;--t:1.4s;"><path d="M540 740 Q970 970 1400 740" stroke="#A9A59C" stroke-width="4" fill="none" stroke-linecap="round" pathLength="1"/></g><g class="a fade" style="--d:3.85s;--t:0.3s;"><path d="M1380.54 741.7 L1400 740 L1394.94 758.86" stroke="#A9A59C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a pop" style="--d:4s;--t:0.6s;"><circle cx="1420" cy="640" r="16" fill="#4ADE80"/></g><g class="a fade" style="--d:4s;--t:0.7s;"><text x="1388.8" y="700" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="26" font-weight="700" fill="#4ADE80" xml:space="preserve"><tspan>4:10</tspan></text></g><g class="a up" st