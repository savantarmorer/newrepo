}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 3.5 · ESTADOS, MUNICÍPIOS E CASOS</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Duas listas, cruzadas por data</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><text x="120" y="269.6" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>O Globo, 2016, repórter Vinicius Sassine: dados da FAB obtidos pela LAI, de 2013 a 2015.</tspan></text></g><g class="a up" style="--d:0.8s;--t:0.7s;"><rect x="120" y="380" width="620" height="420" fill="#141416" stroke="#FF6B5E" stroke-width="3"/><text x="160" y="530" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="130" font-weight="400" fill="#FF6B5E" xml:space="preserve"><tspan>153</tspan></text><text x="160" y="610" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>órgãos para transplante deixaram</tspan></text><text x="160" y="650.96" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>de ser transportados</tspan></text></g><g class="a up" style="--d:1.6s;--t:0.7s;"><rect x="1180" y="380" width="620" height="420" fill="#141416" stroke="#FFB800" stroke-width="3"/><text x="1220" y="530" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="130" font-weight="400" fill="#FFB800" xml:space="preserve"><tspan>716</tspan></text><text x="1220" y="610" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>voos de autoridades atendidos</tspan></text><text x="1220" y="650.96" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>pela FAB nos mesmos dias</tspan></text></g><g class="a draw" style="--d:2.6s;--t:0.6s;"><path d="M750 43