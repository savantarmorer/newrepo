 class="a draw" style="--d:2.75s;--t:0.5s;"><path d="M1370.5 560 H1422.5" stroke="#A9A59C" stroke-width="4" fill="none" pathLength="1"/></g><g class="a fade" style="--d:3.1s;--t:0.3s;"><path d="M1408.5 548.8 L1424.5 560 L1408.5 571.2" stroke="#A9A59C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a pop" style="--d:3.2s;--t:0.6s;"><rect x="1432.5" y="420" width="367.5" height="280" fill="#141416" stroke="#FFB800" stroke-width="3"/><text x="1452.5" y="460" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>04</tspan></text><text x="1478.57" y="554.4" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="42" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Gere o hash</tspan></text><text x="1452.91" y="604.5" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>E registre na aba Log da</tspan></text><text x="1560.14" y="639.5" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>planilha.</tspan></text></g><g class="a up" style="--d:4.6s;--t:0.7s;"><text x="120" y="840" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Se alguém disser que você adulterou o documento, você mostra que </tspan><tspan fill="#FFB800">o arquivo é o mesmo desde o dia</tspan></text><text x="120" y="883.52" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan fill="#FFB800">em que chegou</tspan><tspan>.</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" f