}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 2.3 · DOCUMENTOS</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Cadeia de custódia</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><text x="120" y="269.6" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>O registro de por onde a prova passou. Para o jornalista, não é obrigação: é boa prática que vira</tspan></text><text x="120" y="313.8" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>defesa.</tspan></text></g><g class="a pop" style="--d:0.5s;--t:0.6s;"><rect x="120" y="420" width="367.5" height="280" fill="#141416" stroke="#FFB800" stroke-width="3"/><text x="140" y="460" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>01</tspan></text><text x="236.07" y="554.4" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="42" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Anote</tspan></text><text x="167.4" y="604.5" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Quando recebeu, de</tspan></text><text x="155.2" y="639.5" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>quem e por qual meio.</tspan></text></g><g class="a draw" style="--d:0.95s;--t:0.5s;"><path d="M495.5 560 H547.5" stroke="#A9A59C" stroke-width="4" fill="none" pathLength="1"/></g><g class="a fade" style="--d:1.3s;--t:0.3s;"><path d="M533.5 548.8 L549.5 560 L533.5 571.2" stroke="#A9A59C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a pop" style="--d:1.4s;--t:0.6s;"><rect x="557.5" y="420" width="367.5" height="280" fill="#141416" stroke="#F