}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 5.3 · DELAÇÃO PREMIADA</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Por que desconfiar</tspan></text></g><g class="a up" style="--d:0.6s;--t:0.7s;"><rect x="120" y="300" width="800" height="560" fill="#141416" stroke="#FFB800" stroke-width="3"/><text x="156" y="354" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#FFB800" letter-spacing="3.36" xml:space="preserve"><tspan>O INCENTIVO EMBUTIDO</tspan></text></g><g class="a growY" style="--d:1s;--t:0.9s;"><rect x="180" y="690" width="100" height="70" fill="#FFB800" fill-opacity="0.35"/></g><g class="a growY" style="--d:1.25s;--t:0.9s;"><rect x="320" y="620" width="100" height="140" fill="#FFB800" fill-opacity="0.48"/></g><g class="a growY" style="--d:1.5s;--t:0.9s;"><rect x="460" y="550" width="100" height="210" fill="#FFB800" fill-opacity="0.61"/></g><g class="a growY" style="--d:1.75s;--t:0.9s;"><rect x="600" y="480" width="100" height="280" fill="#FFB800" fill-opacity="0.74"/></g><g class="a growY" style="--d:2s;--t:0.9s;"><rect x="740" y="410" width="100" height="350" fill="#FFB800" fill-opacity="0.87"/></g><g class="a fade" style="--d:2.4s;--t:0.7s;"><text x="217.6" y="820" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="28" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>quanto mais entrega → maior o prêmio</tspan></text></g><g class="a up" style="--d:2.8s;--t:0.7s;"><text x="1000" y="380" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Isso não torna o delator mentiroso. </tspan><tspan fill="#FFB800">Torna a</tspan></text><text x="1000" y="423.52" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan fill="#FFB800">palavra dele interessada.</tspan></text></g><g class="a up" style="--d:3.8s;--t:0.7s;"><rect x="1000" y="540" width="800" height="320" fill="#141416" stroke="#FF6B5E" stroke-width="3"/><text x="1036" y="594" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#FF6B5E" letter-spacing="3.36" xml:space="preserve"><tspan>ART. 7º, §3º</tspan></text><text x="1036" y="650" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>O acordo e os depoimentos ficam em sigilo até o</tspan></text><text x="1036" y="688.4" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>recebimento da denúncia.</tspan></text><text x="1036" y="790" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Se vazou antes, </tspan><tspan fill="#FF6B5E">alguém escolheu vazar</tspan><tspan>. Por</tspan></text><text x="1036" y="833.52" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>que agora?</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Conteúdo educativo. Não substitui advogado no caso concreto.</tspan></text></g></svg>