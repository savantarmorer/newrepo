<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" data-dur="5.9" data-id="1.1-03"><style>@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Grotesk:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=block');.a{animation-duration:var(--t);animation-delay:var(--d);animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1)}.fade{animation-name:k-fade}.up{animation-name:k-up}.down{animation-name:k-down}.left{animation-name:k-left}.right{animation-name:k-right}.pop{animation-name:k-pop;transform-box:fill-box;transform-origin:center}.stamp{animation-name:k-stamp;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.3,1.4,.5,1)}.draw{animation-name:k-draw;stroke-dasharray:1;stroke-dashoffset:1;animation-timing-function:cubic-bezier(.6,0,.3,1)}.draw path,.draw line,.draw polyline,.draw rect,.draw circle{stroke-dasharray:1 1}.grow{animation-name:k-grow;transform-box:fill-box;transform-origin:left center}.growY{animation-name:k-growY;transform-box:fill-box;transform-origin:center bottom}.uncover{animation-name:k-uncover;transform-box:fill-box;transform-origin:right center;animation-timing-function:cubic-bezier(.7,0,.2,1)}.dim{animation-name:k-dim}.gone{animation-name:k-gone}.shake{animation-name:k-shake;animation-timing-function:linear}.drop{animation-name:k-drop;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.5,0,.9,.5)}.zoom{animation-name:k-zoom;transform-box:view-box;animation-timing-function:cubic-bezier(.6,0,.2,1)}.pulse{animation-name:k-pulse;transform-box:fill-box;transform-origin:center;animation-iteration-count:2}.slideL{animation-name:k-slideL}.slideR{animation-name:k-slideR}.spin{animation-name:k-spin;transform-box:view-box;animation-timing-function:linear}@keyframes k-fade{from{opacity:0}to{opacity:1}}@keyframes k-up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 1.1 · O QUE É APURAÇÃO</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="58" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Investigar é revelar ao público questões </tspan><tspan fill="#FFB800">escondidas</tspan><tspan>.</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><rect x="120" y="380" width="536" height="520" fill="#141416" stroke="#FFB800" stroke-width="3"/><rect x="120" y="380" width="536" height="10" fill="#FFB800"/><g transform="translate(148,416) scale(1.13)" fill="none" stroke="#FFB800" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><path d="M8 40 L12 28 L32 8 L40 16 L20 36 Z M28 12 L36 20" /></g><text x="575.2" y="450" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="44" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>01</tspan></text><text x="148" y="522" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="40" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Trabalho original</tspan></text><text x="148" y="582" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Você produziu a informação.</tspan></text><text x="148" y="623.6" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Não repercutiu a de outro.</tspan></text></g><g class="a up" style="--d:1.3s;--t:0.7s;"><rect x="692" y="380" width="536" height="520" fill="#141416" stroke="#FFB800" stroke-width="3"/><rect x="692" y="380" width="536" height="10" fill="#FFB800"/><g transform="translate(720,416) scale(1.13)" fill="none" stroke="#FFB800" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="16" r="7"/><circle cx="33" cy="18" r="6"/><path d="M4 40 C4 29 30 29 30 40 M30 31 C36 29 44 31 44 40" /></g><text x="1147.2" y="450" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="44" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>02</tspan></text><text x="720" y="522" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="40" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Interesse público</tspan></text><text x="720" y="582" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Envolve dinheiro público,</tspan></text><text x="720" y="623.6" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>poder público ou direitos de</tspan></text><text x="720" y="665.2" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>muita gente.</tspan></text></g><g class="a up" style="--d:2.2s;--t:0.7s;"><rect x="1264" y="380" width="536" height="520" fill="#141416" stroke="#FFB800" stroke-width="3"/><rect x="1264" y="380" width="536" height="10" fill="#FFB800"/><g transform="translate(1292,416) scale(1.13)" fill="none" stroke="#FFB800" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="12"/><path d="M29 29 L42 42" /></g><text x="1719.2" y="450" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="44" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>03</tspan></text><text x="1292" y="522" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="40" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Estava escondido</tspan></text><text x="1292" y="582" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>De propósito, por alguém com</tspan></text><text x="1292" y="623.6" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>poder. Ou espalhado em dez</tspan></text><text x="1292" y="665.2" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>bases que ninguém se deu ao</tspan></text><text x="1292" y="706.8" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>trabalho de juntar.</tspan></text></g><g class="a fade" style="--d:2.7s;--t:0.7s;"><text x="1292" y="829.14" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28.8" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>O segundo tipo é o mais comum. E</tspan></text><text x="1292" y="866" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28.8" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>o mais barato de achar.</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Fonte: manual “A Investigação a partir de Histórias”, UNESCO, coordenado por Mark Lee Hunter</tspan></text></g></svg>