<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" data-dur="9.1" data-id="3.2-02"><style>@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Grotesk:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=block');.a{animation-duration:var(--t);animation-delay:var(--d);animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1)}.fade{animation-name:k-fade}.up{animation-name:k-up}.down{animation-name:k-down}.left{animation-name:k-left}.right{animation-name:k-right}.pop{animation-name:k-pop;transform-box:fill-box;transform-origin:center}.stamp{animation-name:k-stamp;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.3,1.4,.5,1)}.draw{animation-name:k-draw;stroke-dasharray:1;stroke-dashoffset:1;animation-timing-function:cubic-bezier(.6,0,.3,1)}.draw path,.draw line,.draw polyline,.draw rect,.draw circle{stroke-dasharray:1 1}.grow{animation-name:k-grow;transform-box:fill-box;transform-origin:left center}.growY{animation-name:k-growY;transform-box:fill-box;transform-origin:center bottom}.uncover{animation-name:k-uncover;transform-box:fill-box;transform-origin:right center;animation-timing-function:cubic-bezier(.7,0,.2,1)}.dim{animation-name:k-dim}.gone{animation-name:k-gone}.shake{animation-name:k-shake;animation-timing-function:linear}.drop{animation-name:k-drop;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.5,0,.9,.5)}.zoom{animation-name:k-zoom;transform-box:view-box;animation-timing-function:cubic-bezier(.6,0,.2,1)}.pulse{animation-name:k-pulse;transform-box:fill-box;transform-origin:center;animation-iteration-count:2}.slideL{animation-name:k-slideL}.slideR{animation-name:k-slideR}.spin{animation-name:k-spin;transform-box:view-box;animation-timing-function:linear}@keyframes k-fade{from{opacity:0}to{opacity:1}}@keyframes k-up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 3.2 · O PEDIDO</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="190" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>O pedido em cinco partes</tspan></text></g><g class="a up" style="--d:0.5s;--t:0.7s;"><rect x="120" y="250" width="1060" height="520" fill="#141416" stroke="#66666F" stroke-width="2"/><text x="160" y="320" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Solicito </tspan><tspan fill="#FFB800">cópia integral dos contratos, termos aditivos e</tspan></text><text x="160" y="368.28" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan fill="#FFB800">notas de empenho</tspan><tspan> firmados entre </tspan><tspan fill="#4ADE80">a Secretaria Municipal</tspan></text><text x="160" y="416.56" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan fill="#4ADE80">de Educação e a empresa X, CNPJ tal</tspan><tspan>, </tspan><tspan fill="#8FB8FF">de 1º de janeiro de</tspan></text><text x="160" y="464.84" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan fill="#8FB8FF">2023 a 31 de dezembro de 2025</tspan><tspan>, </tspan><tspan fill="#FF6B5E">em formato aberto</tspan><tspan>.</tspan></text><text x="160" y="513.12" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan font-weight="700">Havendo parte sigilosa, requeiro acesso à parte não</tspan></text><text x="160" y="561.4" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan font-weight="700">sigilosa, com indicação do fundamento legal.</tspan></text></g><g class="a left" style="--d:1.4s;--t:0.7s;"><rect x="1220" y="250" width="10" height="90" fill="#FFB800"/><text x="1250" y="282" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="28" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>01 · Objeto</tspan></text><text x="1250" y="320" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>“Cópia integral”, não “informações sobre”.</tspan></text></g><g class="a left" style="--d:2.2s;--t:0.7s;"><rect x="1220" y="358" width="10" height="90" fill="#8FB8FF"/><text x="1250" y="390" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="28" font-weight="700" fill="#8FB8FF" xml:space="preserve"><tspan>02 · Período</tspan></text><text x="1250" y="428" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>De quando a quando.</tspan></text></g><g class="a left" style="--d:3s;--t:0.7s;"><rect x="1220" y="466" width="10" height="90" fill="#4ADE80"/><text x="1250" y="498" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="28" font-weight="700" fill="#4ADE80" xml:space="preserve"><tspan>03 · Recorte</tspan></text><text x="1250" y="536" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Órgão, unidade, empresa, com CNPJ.</tspan></text></g><g class="a left" style="--d:3.8s;--t:0.7s;"><rect x="1220" y="574" width="10" height="90" fill="#FF6B5E"/><text x="1250" y="606" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="28" font-weight="700" fill="#FF6B5E" xml:space="preserve"><tspan>04 · Formato</tspan></text><text x="1250" y="644" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Planilha aberta. PDF pesquisável.</tspan></text></g><g class="a left" style="--d:4.6s;--t:0.7s;"><rect x="1220" y="682" width="10" height="90" fill="#F4F1EA"/><text x="1250" y="714" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="28" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>05 · Subsidiário</tspan></text><text x="1250" y="752" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>O pedido reserva. Art. 7º, §2º.</tspan></text></g><g class="a up" style="--d:6s;--t:0.7s;"><rect x="120" y="820" width="1680" height="110" fill="#1C1C1F" stroke="#FFB800" stroke-width="2"/><text x="150" y="862" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>06 · OPCIONAL</tspan></text><text x="150" y="905" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>“Caso o órgão não detenha a informação, indique quem a detém.” </tspan><tspan fill="#8A867D">O art. 11 obriga o órgão a fazer isso.</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Modelo A dos bônus · Lei 12.527/2011, arts. 7º, §2º, e 11</tspan></text></g></svg>