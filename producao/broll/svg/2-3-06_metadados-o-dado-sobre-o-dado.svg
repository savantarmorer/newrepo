Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>as coordenadas de onde foi tirada.</tspan></text></g><g class="a up" style="--d:5.2s;--t:0.7s;"><text x="1080" y="790" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan fill="#FFB800">Antes de publicar, remova os metadados.</tspan><tspan> Eles</tspan></text><text x="1080" y="828.4" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>podem apontar para a sua fonte.</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Exemplo fictício</tspan></text></g></svg>