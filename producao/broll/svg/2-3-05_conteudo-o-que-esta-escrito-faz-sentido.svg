<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" data-dur="7.2" data-id="2.3-05"><style>@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Grotesk:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=block');.a{animation-duration:var(--t);animation-delay:var(--d);animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1)}.fade{animation-name:k-fade}.up{animation-name:k-up}.down{animation-name:k-down}.left{animation-name:k-left}.right{animation-name:k-right}.pop{animation-name:k-pop;transform-box:fill-box;transform-origin:center}.stamp{animation-name:k-stamp;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.3,1.4,.5,1)}.draw{animation-name:k-draw;stroke-dasharray:1;stroke-dashoffset:1;animation-timing-function:cubic-bezier(.6,0,.3,1)}.draw path,.draw line,.draw polyline,.draw rect,.draw circle{stroke-dasharray:1 1}.grow{animation-name:k-grow;transform-box:fill-box;transform-origin:left center}.growY{animation-name:k-growY;transform-box:fill-box;transform-origin:center bottom}.uncover{animation-name:k-uncover;transform-box:fill-box;transform-origin:right center;animation-timing-function:cubic-bezier(.7,0,.2,1)}.dim{animation-name:k-dim}.gone{animation-name:k-gone}.shake{animation-name:k-shake;animation-timing-function:linear}.drop{animation-name:k-drop;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.5,0,.9,.5)}.zoom{animation-name:k-zoom;transform-box:view-box;animation-timing-function:cubic-bezier(.6,0,.2,1)}.pulse{animation-name:k-pulse;transform-box:fill-box;transform-origin:center;animation-iteration-count:2}.slideL{animation-name:k-slideL}.slideR{animation-name:k-slideR}.spin{animation-name:k-spin;transform-box:view-box;animation-timing-function:linear}@keyframes k-fade{from{opacity:0}to{opacity:1}}@keyframes k-up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 2.3 · DOCUMENTOS</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Conteúdo: o que está escrito faz sentido?</tspan></text></g><g class="a up" style="--d:0.5s;--t:0.7s;"><rect x="120" y="320.84" width="44.1" height="44.1" fill="#FFB800"/><g transform="translate(125.88,326.72) scale(0.68)" fill="none" stroke="#0C0C0D" stroke-width="7.33" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5 L44 41 H4 Z M24 18 V29 M24 34 V35" /></g><text x="190.1" y="353.6" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>As datas batem com o calendário?</tspan></text><text x="190.1" y="403.26" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Um ofício datado de domingo não é impossível. É estranho.</tspan></text></g><g class="a up" style="--d:1.7s;--t:0.7s;"><rect x="120" y="459.59999999999997" width="44.1" height="44.1" fill="#FFB800"/><g transform="translate(125.88,465.48) scale(0.68)" fill="none" stroke="#0C0C0D" stroke-width="7.33" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5 L44 41 H4 Z M24 18 V29 M24 34 V35" /></g><text x="190.1" y="492.36" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Quem assina ocupava aquele cargo naquela data?</tspan></text><text x="190.1" y="542.02" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Confira no Diário Oficial.</tspan></text></g><g class="a up" style="--d:2.9s;--t:0.7s;"><rect x="120" y="598.36" width="44.1" height="44.1" fill="#FFB800"/><g transform="translate(125.88,604.24) scale(0.68)" fill="none" stroke="#0C0C0D" stroke-width="7.33" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5 L44 41 H4 Z M24 18 V29 M24 34 V35" /></g><text x="190.1" y="631.12" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Os valores conversam com outras bases?</tspan></text><text x="190.1" y="680.78" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Um contrato de R$ 2 milhões que não aparece no portal de contratações pede explicação.</tspan></text></g><g class="a up" style="--d:4.1s;--t:0.7s;"><rect x="120" y="737.12" width="44.1" height="44.1" fill="#FFB800"/><g transform="translate(125.88,743) scale(0.68)" fill="none" stroke="#0C0C0D" stroke-width="7.33" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5 L44 41 H4 Z M24 18 V29 M24 34 V35" /></g><text x="190.1" y="769.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>O timbre é da gestão certa?</tspan></text><text x="190.1" y="819.54" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Logotipo de governo muda com o governo. Documento de 2023 com a marca de 2025 foi feito depois.</tspan></text></g></svg>