}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 2.2 · SIGILO DA FONTE</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Protocolo para fonte sensível</tspan></text></g><g class="a up" style="--d:0.5s;--t:0.7s;"><rect x="120" y="310" width="35.2" height="35.2" fill="none" stroke="#66666F" stroke-width="3"/><text x="174.4" y="338.16" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>Primeiro contato por um canal que não a</tspan></text><text x="174.4" y="379.12" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>comprometa</tspan></text><text x="174.4" y="411.76" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="23.04" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Nunca pelo e-mail ou telefone do trabalho dela.</tspan></text></g><g class="a draw" style="--d:0.85s;--t:0.45s;"><path d="M126.336 328.304 L134.784 336.752 L150.272 317.744" stroke="#4ADE80" stroke-width="5.12" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g><g class="a up" style="--d:1.3s;--t:0.7s;"><rect x="120" y="459.4112" width="35.2" height="35.2" fill="none" stroke="#66666F" stroke-width="3"/><text x="174.4" y="487.57" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>Aplicativo com criptografia de ponta a ponta</tspan></text><text x="174.4" y="520.21" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="23.04" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Só quem manda e quem recebe leem. Mensagens temporárias</tspan></text><text x="174.4" y="549.7" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="23.04" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>ligadas.</tspan></text></g><g class="a draw" style="--d:1.65s;--t:0.45s;"><path d="M126.336 477.7152 L134.784 486.1632 L150.272 467.15520000000004" stroke="#4ADE80" stroke-width="5.12" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g><g class="a up" style="--d:2.1s;--t:0.7s;"><rect x="120" y="597.3536" width="35.2" height="35.2" fill="none" stroke="#66666F" stroke-width="3"/><text x="174.4" y="625.51" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>Nome verdadeiro fora dos seus contatos</tspan></text></g><g class="a draw" style="--d:2.45s;--t:0.45s;"><path d="M126.336 615.6576 L134.784 624.1056 L150.272 605.0976" stroke="#4ADE80" stroke-width="5.12" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g><g class="a up" style="--d:2.9s;--t:0.7s;"><rect x="990" y="310" width="35.2" height="35.2" fill="none" stroke="#66666F" stroke-width="3"/><text x="1044.4" y="338.16" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>Muito sensível: encontro pessoal</tspan></text><text x="1044.4" y="370.8" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="23.04" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Sem celulares na mesa.</tspan></text></g><g class="a draw" style="--d:3.25s;--t:0.45s;"><path d="M996.336 328.304 L1004.784 336.752 L1020.272 317.744" stroke="#4ADE80" stroke-width="5.12" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g><g class="a up" style="--d:3.7s;--t:0.7s;"><rect x="990" y="418.4512" width="35.2" height="35.2" fill="none" stroke="#66666F" stroke-width="3"/><text x="1044.4" y="446.61" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>Nunca publique o documento como chegou</tspan></text><text x="1044.4" y="479.25" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="23.04" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Recrie, transcreva, recorte. O arquivo pode ter marcas de quem</tspan></text><text x="1044.4" y="508.74" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="23.04" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>vazou.</tspan></text></g><g class="a draw" style="--d:4.05s;--t:0.45s;"><path d="M996.336 436.75519999999995 L1004.784 445.2032 L1020.272 426.1952" stroke="#4ADE80" stroke-width="5.12" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g><g class="a up" style="--d:4.5s;--t:0.7s;"><rect x="990" y="556.3936" width="35.2" height="35.2" fill="none" stroke="#66666F" stroke-width="3"/><text x="1044.4" y="584.55" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>Nunca mostre o original ao investigado</tspan></text><text x="1044.4" y="617.19" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="23.04" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Descreva o conteúdo. Não entregue o papel.</tspan></text></g><g class="a draw" style="--d:4.85s;--t:0.45s;"><path d="M996.336 574.6976 L1004.784 583.1456 L1020.272 564.1376" stroke="#4ADE80" stroke-width="5.12" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g></svg>