ção de preços</tspan></text><text x="658" y="551.84" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan fill="#4ADE80">que o preço está acima da média</tspan></text><text x="1238" y="551.84" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan fill="#FF6B5E">que alguém embolsou a diferença</tspan></text></g><g class="a up" style="--d:2.8s;--t:0.7s;"><rect x="120" y="604" width="1680" height="120" fill="#141416" stroke="#2A2A2F" stroke-width="1"/><text x="138" y="653.44" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Uma foto de duas pessoas</tspan></text><text x="138" y="690.24" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>juntas</tspan></text><text x="658" y="671.84" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan fill="#4ADE80">que estiveram juntas</tspan></text><text x="1238" y="671.84" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan fill="#FF6B5E">acordo</tspan></text></g><g class="a up" style="--d:4.2s;--t:0.7s;"><text x="120" y="860" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="36" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Quase nenhum documento prova </tspan><tspan fill="#FFB800">intenção</tspan><tspan>. Descreva o que a pessoa fez. Deixe a intenção para</tspan></text><text x="120" y="906.08" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="36" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>quem julga.</tspan></text></g></svg>