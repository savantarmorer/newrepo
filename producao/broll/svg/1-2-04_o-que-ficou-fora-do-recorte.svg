a Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Publica o extrato da dispensa no diário amanhã.</tspan></text></g><g class="a up" style="--d:0.1s;--t:0.7s;"><rect x="253.52999999999997" y="808.8" width="706.47" height="88.4" rx="18" fill="#264D3B"/><text x="283.53" y="859.3" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Publicado, junto com o laudo da Defesa Civil.</tspan></text></g><g class="a gone" style="--d:3.6s;--t:0.9s;"><rect x="170" y="150" width="820" height="311.6" fill="#0C0C0D" opacity=".86"/><rect x="170" y="692.4" width="820" height="277.6" fill="#0C0C0D" opacity=".86"/></g><g class="a fade" style="--d:0.8s;--t:0.7s;"><rect x="180" y="461.6" width="800" height="230.79999999999995" fill="none" stroke="#FFB800" stroke-width="5" stroke-dasharray="18 10"/></g><g class="a gone" style="--d:3.6s;--t:0.6s;"><g class="a fade" style="--d:1s;--t:0.7s;"><text x="180" y="447.6" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>O PRINT QUE CHEGOU</tspan></text></g></g><g class="a fade" style="--d:4.3s;--t:0.7s;"><text x="170" y="138" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#4ADE80" letter-spacing="3.08" xml:space="preserve"><tspan>A CONVERSA INTEIRA</tspan></text></g><g class="a up" style="--d:1.4s;--t:0.7s;"><text x="1080" y="360" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="56" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>O que ficou fora do</tspan></text><text x="1080" y="431.68" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="56" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>recorte?</tspan></text></g><g class="a up" style="--d:2s;--t:0.7s;"><text x="1080" y=