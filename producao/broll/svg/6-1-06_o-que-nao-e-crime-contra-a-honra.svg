}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 6.1 · CALÚNIA, DIFAMAÇÃO E INJÚRIA</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="56" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>O que não é injúria ou difamação punível</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><rect x="120" y="300" width="536" height="433.88" fill="#141416" stroke="#4ADE80" stroke-width="3"/><rect x="120" y="300" width="536" height="10" fill="#4ADE80"/><g transform="translate(148,336) scale(1.13)" fill="none" stroke="#4ADE80" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><path d="M8 40 L12 28 L32 8 L40 16 L20 36 Z M28 12 L36 20" /></g><text x="548.8" y="370" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="44" font-weight="700" fill="#4ADE80" xml:space="preserve"><tspan>142</tspan></text><text x="148" y="438.4" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="36" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Crítica</tspan></text><text x="148" y="495.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>A opinião desfavorável da crítica</tspan></text><text x="148" y="534.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>literária, artística ou científica.</tspan></text><text x="148" y="573.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Salvo quando inequívoca a</tspan></text><text x="148" y="612.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>intenção de ofender.</tspan></text></g><g class="a up" style="--d:1.3s;--t:0.7s;"><rect x="692" y="300" width="536" height="433.88" fill="#141416" stroke="#4ADE80" stroke-width="3"/><rect x="692" y="300" width="536" height="10" fill="#4ADE80"/><g transform="translate(720,336) scale(1.13)" fill="none" stroke="#4ADE80" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><path d="M6 42 H42 M10 42 V18 H38 V42 M6 18 L24 6 L42 18 M16 24 V36 M24 24 V36 M32 24 V36" /></g><text x="1120.8" y="370" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="44" font-weight="700" fill="#4ADE80" xml:space="preserve"><tspan>142</tspan></text><text x="720" y="438.4" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="36" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Conceito de funcionário</tspan></text><text x="720" y="495.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>O conceito desfavorável emitido</tspan></text><text x="720" y="534.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>por funcionário público no</tspan></text><text x="720" y="573.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>cumprimento do dever do ofício.</tspan></text></g><g class="a up" style="--d:2.2s;--t:0.7s;"><rect x="1264" y="300" width="536" height="433.88" fill="#141416" stroke="#8FB8FF" stroke-width="3"/><rect x="1264" y="300" width="536" height="10" fill="#8FB8FF"/><g transform="translate(1292,336) scale(1.13)" fill="none" stroke="#8FB8FF" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6 V42 M12 42 H36 M8 12 H40 M8 12 L2 26 H14 Z M40 12 L34 26 H46 Z" /></g><text x="1292" y="438.4" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="36" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Intenção de ofender</tspan></text><text x="1292" y="495.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Entendimento antigo dos</tspan></text><text x="1292" y="534.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>tribunais: sem ela, não há crime.</tspan></text><text x="1292" y="573.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Narrar fatos de interesse público</tspan></text><text x="1292" y="612.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>com base em documentos, e</tspan></text><text x="1292" y="651.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>criticar, é diferente de ofender.</tspan></text></g><g class="a up" style="--d:3.6s;--t:0.7s;"><text x="120" y="880" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="36" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Mas isso se discute dentro do processo. </tspan><tspan fill="#FFB800">Não conte com isso como escudo. Conte</tspan></text><text x="120" y="920.32" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="36" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan fill="#FFB800">com os documentos.</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Código Penal, art. 142 · Conteúdo educativo. Não substitui advogado no caso concreto. Regras válidas em setembro de 2026.</tspan></text></g></svg>