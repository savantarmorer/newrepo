}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 3.3 · PRAZOS E RECURSOS</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>O catálogo da enrolação</tspan></text></g><g class="a left" style="--d:0.6s;--t:0.7s;"><rect x="120" y="290" width="700" height="150" rx="14" fill="#232327"/><g transform="translate(146,312) scale(0.71)" fill="none" stroke="#8A867D" stroke-width="4.24" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="38" height="26" rx="2"/><path d="M5 13 L24 27 L43 13" /></g><text x="194" y="338" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="20" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Resposta do órgão</tspan></text><text x="150" y="390" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>“Documento preparatório.”</tspan></text></g><g class="a draw" style="--d:1.2s;--t:0.5s;"><path d="M840 365 H928" stroke="#FFB800" stroke-width="4" fill="none" pathLength="1"/></g><g class="a fade" style="--d:1.55s;--t:0.3s;"><path d="M914 353.8 L930 365 L914 376.2" stroke="#FFB800" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a up" style="--d:1.5s;--t:0.7s;"><rect x="950" y="290" width="850" height="150" fill="#141416" stroke="#FFB800" stroke-width="3"/><text x="980" y="352.44" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Usado para uma decisão ainda não tomada. O art. 7º, §3º,</tspan></text><text x="980" y="385.38" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>garante o acesso quando a decisão sai. </tspan><tspan fill="#FFB800">Se já saiu, recorra.</tspan></text></g><g class="a left" style="--d:2.4s;--t:0.7s;"><rect x="120" y="490" width="700" height="150" rx="14" fill="#232327"/><g transform="translate(146,512) scale(0.71)" fill="none" stroke="#8A867D" stroke-width="4.24" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="38" height="26" rx="2"/><path d="M5 13 L24 27 L43 13" /></g><text x="194" y="538" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="20" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Resposta do órgão</tspan></text><text x="150" y="590" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>“Informação pessoal.”</tspan></text></g><g class="a draw" style="--d:3s;--t:0.5s;"><path d="M840 565 H928" stroke="#FFB800" stroke-width="4" fill="none" pathLength="1"/></g><g class="a fade" style="--d:3.35s;--t:0.3s;"><path d="M914 553.8 L930 565 L914 576.2" stroke="#FFB800" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a up" style="--d:3.3s;--t:0.7s;"><rect x="950" y="490" width="850" height="150" fill="#141416" stroke="#FFB800" stroke-width="3"/><text x="980" y="569.72" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>A desculpa preferida. </tspan><tspan fill="#FFB800">É o assunto da aula 3.4.</tspan></text></g><g class="a left" style="--d:4.2s;--t:0.7s;"><rect x="120" y="690" width="700" height="150" rx="14" fill="#232327"/><g transform="translate(146,712) scale(0.71)" fill="none" stroke="#8A867D" stroke-width="4.24" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="38" height="26" rx="2"/><path d="M5 13 L24 27 L43 13" /></g><text x="194" y="738" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="20" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Resposta do órgão</tspan></text><text x="150" y="790" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Você pediu contratos. Veio o link da</tspan></text><text x="150" y="826.8" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>página de licitações.</tspan></text></g><g class="a draw" style="--d:4.8s;--t:0.5s;"><path d="M840 765 H928" stroke="#FFB800" stroke-width="4" fill="none" pathLength="1"/></g><g class="a fade" style="--d:5.15s;--t:0.3s;"><path d="M914 753.8 L930 765 L914 776.2" stroke="#FFB800" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a up" style="--d:5.1s;--t:0.7s;"><rect x="950" y="690" width="850" height="150" fill="#141416" stroke="#FFB800" stroke-width="3"/><text x="980" y="752.44" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>É a resposta que responde outra pergunta: </tspan><tspan fill="#FFB800">negativa</tspan></text><text x="980" y="785.38" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan fill="#FFB800">disfarçada. Recorra.</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Lei 12.527/2011, a Lei de Acesso à Informação · regras válidas em setembro de 2026</tspan></text></g></svg>