k',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Você vai errar. Corrija rápido e à vista.</tspan></text></g><g class="a up" style="--d:0.5s;--t:0.7s;"><rect x="120" y="320" width="44" height="44" fill="none" stroke="#66666F" stroke-width="3"/><text x="188" y="355.2" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>Comentário fixado</tspan></text></g><g class="a draw" style="--d:0.85s;--t:0.45s;"><path d="M127.92 342.88 L138.48 353.44 L157.84 329.68" stroke="#4ADE80" stroke-width="6.4" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g><g class="a up" style="--d:1.1s;--t:0.7s;"><rect x="120" y="405.2" width="44" height="44" fill="none" stroke="#66666F" stroke-width="3"/><text x="188" y="440.4" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>Correção na descrição</tspan></text></g><g class="a draw" style="--d:1.45s;--t:0.45s;"><path d="M127.92 428.08 L138.48 438.64 L157.84 414.88" stroke="#4ADE80" stroke-width="6.4" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g><g class="a up" style="--d:1.7s;--t:0.7s;"><rect x="120" y="490.4" width="44" height="44" fill="none" stroke="#66666F" stroke-width="3"/><text x="188" y="525.6" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>Card no vídeo</tspan></text></g><g class="a draw" style="--d:2.05s;--t:0.45s;"><path d="M127.92 513.28 L138.48 523.8399999999999 L157.84 500.08" stroke="#4ADE80" stroke-width="6.4" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g><g class="a up" style="--d:2.3s;--t:0.7s;"><rect x="120" y="575.6" width="44" height="44" fill="none" stroke="#66666F" stroke-width="3"/><text x="188" y="610.8" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>Vídeo de correção</tspan></text><text x="188" y="651.6" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28.799999999999997" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>se o erro for grave</tspan></text></g><g class="a draw" style="--d:2.65s;--t:0.45s;"><path d="M127.92 598.48 L138.48 609.04 L157.84 585.28" stroke="#4ADE80" stroke-width="6.4" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g><g class="a up" style="--d:3s;--t:0.7s;"><rect x="1060" y="320" width="740" height="520" fill="#141416" stroke="#FFB800" stroke-width="3"/><text x="1096" y="374" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>LEI 13.188, ART. 2º, §3º</tspan></text><text x="1096" y="440" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>A correção espontânea não impede o</tspan></text><text x="1096" y="480.96" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>direito de resposta nem uma ação de</tspan></text><text x="1096" y="521.92" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>indenização.</tspan></text><text x="1096" y="680" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="44" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Mas mostra boa-fé.</tspan></text><text x="1096" y="750" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="44" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan fill="#FFB800">E boa-fé pesa.</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Conteúdo educativo. Não substitui advogado no caso concreto.</tspan></text></g></svg>