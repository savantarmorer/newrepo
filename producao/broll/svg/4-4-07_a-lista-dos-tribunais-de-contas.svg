}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 4.4 · POLÍTICOS</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>A lista que interessa em ano eleitoral</tspan></text></g><g class="a pop" style="--d:0.5s;--t:0.6s;"><rect x="120" y="320" width="513.33" height="300" fill="#141416" stroke="#FFB800" stroke-width="3"/><text x="140" y="360" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>01</tspan></text><text x="159.99" y="464" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="40" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Tribunais de contas</tspan></text><text x="168.29" y="512" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Julgam as contas de quem gasta</tspan></text><text x="190.09" y="544.5" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>dinheiro público. Acórdãos na</tspan></text><text x="322" y="577" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>internet.</tspan></text></g><g class="a draw" style="--d:0.95s;--t:0.5s;"><path d="M641.33 470 H693.33" stroke="#A9A59C" stroke-width="4" fill="none" pathLength="1"/></g><g class="a fade" style="--d:1.3s;--t:0.3s;"><path d="M679.33 458.8 L695.33 470 L679.33 481.2" stroke="#A9A59C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a pop" style="--d:1.5s;--t:0.6s;"><rect x="703.33" y="320" width="513.33" height="300" fill="#141416" stroke="#FFB800" stroke-width="3"/><text x="723.33" y="360" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>02</tspan></text><text x="766.66" y="464" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="40" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Contas rejeitadas</tspan></text><text x="760.63" y="512" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Por irregularidade insanável, em</tspan></text><text x="836.62" y="544.5" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>decisão irrecorrível.</tspan></text></g><g class="a draw" style="--d:1.95s;--t:0.5s;"><path d="M1224.67 470 H1276.67" stroke="#A9A59C" stroke-width="4" fill="none" pathLength="1"/></g><g class="a fade" style="--d:2.3s;--t:0.3s;"><path d="M1262.67 458.8 L1278.67 470 L1262.67 481.2" stroke="#A9A59C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a pop" style="--d:2.5s;--t:0.6s;"><rect x="1286.67" y="320" width="513.33" height="300" fill="#141416" stroke="#FFB800" stroke-width="3"/><text x="1306.67" y="360" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>03</tspan></text><text x="1363.35" y="464" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="40" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Justiça Eleitoral</tspan></text><text x="1319.33" y="512" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Recebe a lista. Lei 9.504, art. 11, §5º.</tspan></text></g><g class="a up" style="--d:3.6s;--t:0.7s;"><rect x="120" y="700" width="1680" height="200" fill="#141416" stroke="#FF6B5E" stroke-width="3"/><text x="150" y="746" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#FF6B5E" letter-spacing="3.36" xml:space="preserve"><tspan>ANTES DE ESCREVER “INELEGÍVEL”</tspan></text><text x="150" y="800" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>Rejeição de contas pode ter efeito eleitoral, pela Lei da Ficha Limpa. Mas as regras mudaram em 2025. </tspan><tspan fill="#FFB800">Confira a</tspan></text><text x="150" y="838.4" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan fill="#FFB800">redação atual e a decisão da Justiça Eleitoral no caso concreto.</tspan></text></g></svg>