}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 6.2 · RESPONSABILIDADE CIVIL</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Tema 995: quando o entrevistado acusa</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><text x="120" y="269.6" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Tese de 2023, revisada em embargos.</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><rect x="120" y="400" width="536" height="326" fill="#141416" stroke="#FF6B5E" stroke-width="3"/><rect x="120" y="400" width="536" height="10" fill="#FF6B5E"/><g transform="translate(148,436) scale(1.13)" fill="none" stroke="#FF6B5E" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5 L44 41 H4 Z M24 18 V29 M24 34 V35" /></g><text x="148" y="533" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="30" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Má-fé</tspan></text><text x="148" y="584" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan fill="#FFB800">Dolo</tspan><tspan>: sabia que a acusação era falsa. Ou</tspan></text><text x="148" y="615.2" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan fill="#FFB800">culpa grave</tspan><tspan>: divulgou sem ouvir o</tspan></text><text x="148" y="646.4" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>ofendido ou sem buscar o contraditório.</tspan></text></g><g class="a up" style="--d:1.3s;--t:0.7s;"><rect x="692" y="400" width="536" height="326" fill="#141416" stroke="#FFB800" stroke-width="3"/><rect x="692" y="400" width="536" height="10" fill="#FFB800"/><g transform="translate(720,436) scale(1.13)" fill="none" stroke="#FFB800" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="30" height="26" rx="2"/><path d="M34 20 L44 14 V34 L34 28" /></g><text x="720" y="533" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="30" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Ao vivo</tspan></text><text x="720" y="584" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>O veículo não responde pelo que o</tspan></text><text x="720" y="615.2" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>convidado disse por conta própria. Mas</tspan></text><text x="720" y="646.4" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>deve garantir o direito de resposta.</tspan></text></g><g class="a up" style="--d:2.2s;--t:0.7s;"><rect x="1264" y="400" width="536" height="326" fill="#141416" stroke="#8FB8FF" stroke-width="3"/><rect x="1264" y="400" width="536" height="10" fill="#8FB8FF"/><g transform="translate(1292,436) scale(1.13)" fill="none" stroke="#8FB8FF" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8 L40 40 M40 8 L8 40" /></g><text x="1292" y="533" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="30" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Falsidade constatada</tspan></text><text x="1292" y="584" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>O conteúdo deve ser removido.</tspan></text></g><g class="a up" style="--d:3.6s;--t:0.7s;"><rect x="120" y="800" width="1680" height="160" fill="#1C1C1F" stroke="#FFB800" stroke-width="2"/><text x="150" y="846" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>LIVES, PODCASTS E CORTES</tspan></text><text x="150" y="900" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>O convidado acusou alguém? Peça as provas. Dê espaço ao outro lado. Se a acusação for falsa, tire o trecho do ar.</tspan></text><text x="150" y="935.84" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan fill="#FFB800">Principalmente dos cortes, que circulam sozinhos.</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>STF, Tema 995 · Conteúdo educativo. Não substitui advogado no caso concreto. Regras válidas em setembro de 2026.</tspan></text></g></svg>