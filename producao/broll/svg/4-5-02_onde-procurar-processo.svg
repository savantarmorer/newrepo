<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" data-dur="5.9" data-id="4.5-02"><style>@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Grotesk:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=block');.a{animation-duration:var(--t);animation-delay:var(--d);animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1)}.fade{animation-name:k-fade}.up{animation-name:k-up}.down{animation-name:k-down}.left{animation-name:k-left}.right{animation-name:k-right}.pop{animation-name:k-pop;transform-box:fill-box;transform-origin:center}.stamp{animation-name:k-stamp;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.3,1.4,.5,1)}.draw{animation-name:k-draw;stroke-dasharray:1;stroke-dashoffset:1;animation-timing-function:cubic-bezier(.6,0,.3,1)}.draw path,.draw line,.draw polyline,.draw rect,.draw circle{stroke-dasharray:1 1}.grow{animation-name:k-grow;transform-box:fill-box;transform-origin:left center}.growY{animation-name:k-growY;transform-box:fill-box;transform-origin:center bottom}.uncover{animation-name:k-uncover;transform-box:fill-box;transform-origin:right center;animation-timing-function:cubic-bezier(.7,0,.2,1)}.dim{animation-name:k-dim}.gone{animation-name:k-gone}.shake{animation-name:k-shake;animation-timing-function:linear}.drop{animation-name:k-drop;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.5,0,.9,.5)}.zoom{animation-name:k-zoom;transform-box:view-box;animation-timing-function:cubic-bezier(.6,0,.2,1)}.pulse{animation-name:k-pulse;transform-box:fill-box;transform-origin:center;animation-iteration-count:2}.slideL{animation-name:k-slideL}.slideR{animation-name:k-slideR}.spin{animation-name:k-spin;transform-box:view-box;animation-timing-function:linear}@keyframes k-fade{from{opacity:0}to{opacity:1}}@keyframes k-up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 4.5 · PROCESSOS, IMÓVEIS E AERONAVES</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Onde procurar processo</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><text x="120" y="269.6" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Processo judicial é, em regra, público. Constituição, art. 93, IX.</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><rect x="120" y="400" width="536" height="469.44" fill="#141416" stroke="#4ADE80" stroke-width="3"/><rect x="120" y="400" width="536" height="10" fill="#4ADE80"/><g transform="translate(148,436) scale(1.13)" fill="none" stroke="#4ADE80" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8 L34 22 M14 14 L28 28 M17 11 L31 25 M24 25 L40 41 M6 42 H26" /></g><text x="148" y="538.4" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="36" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Consulta do tribunal</tspan></text><text x="148" y="595.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>O sistema oficial. Uns buscam</tspan></text><text x="148" y="634.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>por nome, CPF ou CNPJ da parte.</tspan></text><text x="148" y="673.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Outros, só por número ou</tspan></text><text x="148" y="712.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>advogado.</tspan></text></g><g class="a fade" style="--d:0.9s;--t:0.7s;"><text x="148" y="835.44" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="700" fill="#4ADE80" xml:space="preserve"><tspan>Para achar o processo de alguém.</tspan></text></g><g class="a up" style="--d:1.3s;--t:0.7s;"><rect x="692" y="400" width="536" height="469.44" fill="#141416" stroke="#8FB8FF" stroke-width="3"/><rect x="692" y="400" width="536" height="10" fill="#8FB8FF"/><g transform="translate(720,436) scale(1.13)" fill="none" stroke="#8FB8FF" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19"/><path d="M5 24 H43 M24 5 C14 16 14 32 24 43 M24 5 C34 16 34 32 24 43" /></g><text x="720" y="538.4" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="36" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>DataJud, do CNJ</tspan></text><text x="720" y="595.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>API pública com metadados dos</tspan></text><text x="720" y="634.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>processos do país: classe,</tspan></text><text x="720" y="673.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>assunto, movimentações.</tspan></text></g><g class="a fade" style="--d:1.8s;--t:0.7s;"><text x="720" y="835.44" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="700" fill="#8FB8FF" xml:space="preserve"><tspan>Para medir volume e padrão.</tspan></text></g><g class="a up" style="--d:2.2s;--t:0.7s;"><rect x="1264" y="400" width="536" height="469.44" fill="#141416" stroke="#FFB800" stroke-width="3"/><rect x="1264" y="400" width="536" height="10" fill="#FFB800"/><g transform="translate(1292,436) scale(1.13)" fill="none" stroke="#FFB800" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="12"/><path d="M29 29 L42 42" /></g><text x="1292" y="538.4" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="36" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Buscadores privados</tspan></text><text x="1292" y="595.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Jusbrasil, Escavador. Úteis para</tspan></text><text x="1292" y="634.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>começar. Erram homônimo,</tspan></text><text x="1292" y="673.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>erram fase, erram tudo o que um</tspan></text><text x="1292" y="712.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>robô pode errar.</tspan></text></g><g class="a fade" style="--d:2.7s;--t:0.7s;"><text x="1292" y="835.44" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>Confira sempre no oficial.</tspan></text></g></svg>