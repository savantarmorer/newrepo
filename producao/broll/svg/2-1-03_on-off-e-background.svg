}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 2.1 · FONTES HUMANAS</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Três combinações</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><text x="120" y="269.6" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Regra de ouro: combine </tspan><tspan fill="#FFB800">antes</tspan><tspan> de ouvir.</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><rect x="120" y="380" width="536" height="540" fill="#141416" stroke="#4ADE80" stroke-width="3"/><rect x="120" y="380" width="536" height="10" fill="#4ADE80"/><g transform="translate(148,416) scale(1.13)" fill="none" stroke="#4ADE80" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="15" r="8"/><path d="M8 43 C8 31 40 31 40 43" /></g><text x="148" y="527.4" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="46" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>On</tspan></text><text x="148" y="586.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Publicada com o nome da fonte.</tspan></text><text x="148" y="625.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"></text><text x="148" y="664.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan font-weight="700">“Segundo Fulano, ex-diretor</tspan></text><text x="148" y="703.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan font-weight="700">financeiro…”</tspan></text></g><g class="a fade" style="--d:0.9s;--t:0.7s;"><text x="148" y="886" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="700" fill="#4ADE80" xml:space="preserve"><tspan>O nome vai ao ar.</tspan></text></g><g class="a up" style="--d:1.3s;--t:0.7s;"><rect x="692" y="380" width="536" height="540" fill="#141416" stroke="#FFB800" stroke-width="3"/><rect x="692" y="380" width="536" height="10" fill="#FFB800"/><g transform="translate(720,416) scale(1.13)" fill="none" stroke="#FFB800" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><path d="M4 24 C12 12 36 12 44 24 C36 36 12 36 4 24 Z"/><circle cx="24" cy="24" r="6"/></g><text x="720" y="527.4" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="46" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Off</tspan></text><text x="720" y="586.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Usada, sem identificar quem</tspan></text><text x="720" y="625.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>falou.</tspan></text><text x="720" y="664.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"></text><text x="720" y="703.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan font-weight="700">“Segundo um servidor da</tspan></text><text x="720" y="742.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan font-weight="700">secretaria que pediu para não</tspan></text><text x="720" y="781.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan font-weight="700">ser identificado…”</tspan></text></g><g class="a fade" style="--d:1.8s;--t:0.7s;"><text x="720" y="886" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>A informação vai. O nome, não.</tspan></text></g><g class="a up" style="--d:2.2s;--t:0.7s;"><rect x="1264" y="380" width="536" height="540" fill="#141416" stroke="#8FB8FF" stroke-width="3"/><rect x="1264" y="380" width="536" height="10" fill="#8FB8FF"/><g transform="translate(1292,416) scale(1.13)" fill="none" stroke="#8FB8FF" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="12"/><path d="M29 29 L42 42" /></g><text x="1292" y="527.4" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="46" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Background</tspan></text><text x="1292" y="586.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Não é publicada. Só orienta</tspan></text><text x="1292" y="625.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>você.</tspan></text><text x="1292" y="664.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"></text><text x="1292" y="703.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan font-weight="700">“Olhe o contrato de 2024, não o</tspan></text><text x="1292" y="742.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan font-weight="700">de 2023.”</tspan></text></g><g class="a fade" style="--d:2.7s;--t:0.7s;"><text x="1292" y="886" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="700" fill="#8FB8FF" xml:space="preserve"><tspan>Nada vai ao ar.</tspan></text></g></svg>