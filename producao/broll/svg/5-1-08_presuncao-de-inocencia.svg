<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" data-dur="7.5" data-id="5.1-08"><style>@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Grotesk:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=block');.a{animation-duration:var(--t);animation-delay:var(--d);animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1)}.fade{animation-name:k-fade}.up{animation-name:k-up}.down{animation-name:k-down}.left{animation-name:k-left}.right{animation-name:k-right}.pop{animation-name:k-pop;transform-box:fill-box;transform-origin:center}.stamp{animation-name:k-stamp;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.3,1.4,.5,1)}.draw{animation-name:k-draw;stroke-dasharray:1;stroke-dashoffset:1;animation-timing-function:cubic-bezier(.6,0,.3,1)}.draw path,.draw line,.draw polyline,.draw rect,.draw circle{stroke-dasharray:1 1}.grow{animation-name:k-grow;transform-box:fill-box;transform-origin:left center}.growY{animation-name:k-growY;transform-box:fill-box;transform-origin:center bottom}.uncover{animation-name:k-uncover;transform-box:fill-box;transform-origin:right center;animation-timing-function:cubic-bezier(.7,0,.2,1)}.dim{animation-name:k-dim}.gone{animation-name:k-gone}.shake{animation-name:k-shake;animation-timing-function:linear}.drop{animation-name:k-drop;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.5,0,.9,.5)}.zoom{animation-name:k-zoom;transform-box:view-box;animation-timing-function:cubic-bezier(.6,0,.2,1)}.pulse{animation-name:k-pulse;transform-box:fill-box;transform-origin:center;animation-iteration-count:2}.slideL{animation-name:k-slideL}.slideR{animation-name:k-slideR}.spin{animation-name:k-spin;transform-box:view-box;animation-timing-function:linear}@keyframes k-fade{from{opacity:0}to{opacity:1}}@keyframes k-up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 5.1 · INDÍCIO, PROVA E VERSÃO</tspan></text></g><g class="a up" style="--d:0.3s;--t:0.7s;"><rect x="274" y="194" width="1400" height="273.2" fill="#FFB800"/><rect x="260" y="180" width="1400" height="273.2" fill="#F5F1E8" stroke="#F5F1E8" stroke-width="0"/><text x="316" y="240" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#7A5400" letter-spacing="1.92" xml:space="preserve"><tspan>CONSTITUIÇÃO FEDERAL · ART. 5º, LVII</tspan></text><rect x="316" y="262" width="1288" height="2" fill="#D8D0BE"/><g class="a grow" style="--d:1.4s;--t:0.7s;"><rect x="1209.67" y="307.36" width="257.7" height="49.28" fill="#FFB800" opacity="0.55"/></g><g class="a grow" style="--d:1.9s;--t:0.7s;"><rect x="310" y="368.96" width="169.65" height="49.28" fill="#FFB800" opacity="0.55"/></g><text x="316" y="345.2" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="400" fill="#1C1A17" xml:space="preserve"><tspan>“ninguém será considerado culpado até o </tspan><tspan>trânsito em</tspan></text><text x="316" y="406.8" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="400" fill="#1C1A17" xml:space="preserve"><tspan>julgado</tspan><tspan> de sentença penal condenatória;”</tspan></text></g><g class="a up" style="--d:2.4s;--t:0.7s;"><text x="120" y="553.2" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Obriga o Estado, não o jornalista. </tspan><tspan fill="#FFB800">Você pode e deve investigar quem ainda não foi condenado.</tspan></text></g><g class="a up" style="--d:3.4s;--t:0.7s;"><text x="120" y="673.2" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Mas chamar alguém de criminoso antes da condenação definitiva é imputar crime. Se você não provar, o módulo 6</tspan></text><text x="120" y="711.6" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>tem nome para isso: calúnia.</tspan></text></g><g class="a up" style="--d:4.4s;--t:0.7s;"><text x="120" y="950" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="44" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>A saída não é o silêncio. </tspan><tspan fill="#FFB800">É a precisão.</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Conteúdo educativo. Não substitui advogado no caso concreto.</tspan></text></g></svg>