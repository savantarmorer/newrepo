<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" data-dur="5.4" data-id="1.2-07"><style>@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Grotesk:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=block');.a{animation-duration:var(--t);animation-delay:var(--d);animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1)}.fade{animation-name:k-fade}.up{animation-name:k-up}.down{animation-name:k-down}.left{animation-name:k-left}.right{animation-name:k-right}.pop{animation-name:k-pop;transform-box:fill-box;transform-origin:center}.stamp{animation-name:k-stamp;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.3,1.4,.5,1)}.draw{animation-name:k-draw;stroke-dasharray:1;stroke-dashoffset:1;animation-timing-function:cubic-bezier(.6,0,.3,1)}.draw path,.draw line,.draw polyline,.draw rect,.draw circle{stroke-dasharray:1 1}.grow{animation-name:k-grow;transform-box:fill-box;transform-origin:left center}.growY{animation-name:k-growY;transform-box:fill-box;transform-origin:center bottom}.uncover{animation-name:k-uncover;transform-box:fill-box;transform-origin:right center;animation-timing-function:cubic-bezier(.7,0,.2,1)}.dim{animation-name:k-dim}.gone{animation-name:k-gone}.shake{animation-name:k-shake;animation-timing-function:linear}.drop{animation-name:k-drop;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.5,0,.9,.5)}.zoom{animation-name:k-zoom;transform-box:view-box;animation-timing-function:cubic-bezier(.6,0,.2,1)}.pulse{animation-name:k-pulse;transform-box:fill-box;transform-origin:center;animation-iteration-count:2}.slideL{animation-name:k-slideL}.slideR{animation-name:k-slideR}.spin{animation-name:k-spin;transform-box:view-box;animation-timing-function:linear}@keyframes k-fade{from{opacity:0}to{opacity:1}}@keyframes k-up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 1.2 · PAUTA VS. DENÚNCIA</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Três jeitos de contratar</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><rect x="120" y="330" width="536" height="380.12" fill="#141416" stroke="#4ADE80" stroke-width="3"/><rect x="120" y="330" width="536" height="10" fill="#4ADE80"/><g transform="translate(148,366) scale(1.13)" fill="none" stroke="#4ADE80" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="16" r="7"/><circle cx="33" cy="18" r="6"/><path d="M4 40 C4 29 30 29 30 40 M30 31 C36 29 44 31 44 40" /></g><text x="148" y="475.6" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="44" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Licitação</tspan></text><text x="148" y="538.12" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>A disputa entre</tspan></text><text x="148" y="582.32" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>fornecedores. Quem oferece</tspan></text><text x="148" y="626.52" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>a melhor proposta leva.</tspan></text></g><g class="a up" style="--d:1.3s;--t:0.7s;"><rect x="692" y="330" width="536" height="380.12" fill="#141416" stroke="#FFB800" stroke-width="3"/><rect x="692" y="330" width="536" height="10" fill="#FFB800"/><g transform="translate(720,366) scale(1.13)" fill="none" stroke="#FFB800" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><path d="M27 4 L10 27 H23 L20 44 L38 20 H25 Z" /></g><text x="720" y="475.6" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="44" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Dispensa</tspan></text><text x="720" y="538.12" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>A lei permite pular a disputa.</tspan></text><text x="720" y="582.32" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Por valor baixo ou</tspan></text><text x="720" y="626.52" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>emergência, por exemplo.</tspan></text></g><g class="a up" style="--d:2.2s;--t:0.7s;"><rect x="1264" y="330" width="536" height="380.12" fill="#141416" stroke="#8FB8FF" stroke-width="3"/><rect x="1264" y="330" width="536" height="10" fill="#8FB8FF"/><g transform="translate(1292,366) scale(1.13)" fill="none" stroke="#8FB8FF" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="24" r="8"/><path d="M23 24 H42 M36 24 V31 M42 24 V30" /></g><text x="1292" y="475.6" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="44" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Inexigibilidade</tspan></text><text x="1292" y="538.12" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>A disputa é impossível,</tspan></text><text x="1292" y="582.32" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>porque só um fornecedor</tspan></text><text x="1292" y="626.52" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>pode entregar aquilo.</tspan></text></g></svg>