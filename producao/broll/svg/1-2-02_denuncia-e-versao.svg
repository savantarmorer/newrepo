}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 1.2 · PAUTA VS. DENÚNCIA</tspan></text></g><g class="a up" style="--d:0.2s;--t:0.7s;"><text x="120" y="360" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="120" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>DENÚNCIA</tspan></text></g><g class="a up" style="--d:0.7s;--t:0.7s;"><text x="120" y="440" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="500" fill="#F4F1EA" xml:space="preserve"><tspan>do latim </tspan><tspan fill="#FFB800">denuntiare</tspan><tspan>: anunciar, declarar.</tspan></text></g><g class="a up" style="--d:1.2s;--t:0.7s;"><text x="120" y="520" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="46" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Quem denuncia anuncia uma</tspan></text><text x="120" y="578.88" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="46" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan fill="#FFB800">versão</tspan><tspan>.</tspan></text></g><g class="a left" style="--d:1.8s;--t:0.7s;"><rect x="1100" y="250" width="700" height="84" fill="#141416" stroke="#4ADE80" stroke-width="3"/><rect x="1100" y="250" width="12" height="84" fill="#4ADE80"/><text x="1136" y="305" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Pode ser verdadeira.</tspan></text></g><g class="a left" style="--d:2.3s;--t:0.7s;"><rect x="1100" y="360" width="700" height="84" fill="#141416" stroke="#FFB800" stroke-width="3"/><rect x="1100" y="360" width="12" height="84" fill="#FFB800"/><text x="1136" y="415" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Pode ser meia verdade.</tspan></text></g><g class="a left" style="--d:2.8s;--t:0.7s;"><rect x="1100" y="470" width="700" height="84" fill="#141416" stroke="#FF6B5E" stroke-width="3"/><rect x="1100" y="470" width="12" height="84" fill="#FF6B5E"/><text x="1136" y="525" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Pode ser mentira bem montada.</tspan></text></g><g class="a up" style="--d:3.6s;--t:0.7s;"><text x="120" y="690" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>E quase sempre é </tspan><tspan fill="#FFB800">interessada</tspan><tspan>:</tspan></text></g><g class="a pop" style="--d:4.1s;--t:0.6s;"><rect x="120" y="746.2" width="453.6" height="47.6" fill="none" stroke="#A9A59C" stroke-width="2.5"/><text x="136.8" y="780.08" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="28" font-weight="700" fill="#A9A59C" xml:space="preserve"><tspan>o ex-aliado do secretário</tspan></text></g><g class="a pop" style="--d:4.45s;--t:0.6s;"><rect x="597.6" y="746.2" width="638.4" height="47.6" fill="none" stroke="#A9A59C" stroke-width="2.5"/><text x="614.4" y="780.08" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="28" font-weight="700" fill="#A9A59C" xml:space="preserve"><tspan>o concorrente que perdeu a licitação</tspan></text></g><g class="a pop" style="--d:4.8s;--t:0.6s;"><rect x="1260" y="746.2" width="554.4" height="47.6" fill="none" stroke="#A9A59C" stroke-width="2.5"/><text x="1276.8" y="780.08" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="28" font-weight="700" fill="#A9A59C" xml:space="preserve"><tspan>o adversário da próxima eleição</tspan></text></g><g class="a stamp" style="--d:5.6s;--t:0.55s;"><g><rect x="1212.876" y="864.8" width="534.2479999999999" height="70.4" fill="none" stroke="#FFB800" stroke-width="5.279999999999999"/><text x="1239.28" y="915.84" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="44" font-weight="400" fill="#FFB800" xml:space="preserve"><tspan>VERSÃO TEM DONO</tspan></text></g></g><g class="a up" style="--d:5.2s;--t:0.7s;"><text x="120" y="905" font-family="'Space Grotesk',