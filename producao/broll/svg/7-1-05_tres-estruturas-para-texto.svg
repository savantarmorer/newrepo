nt-weight="400" fill="#A9A59C" xml:space="preserve"><tspan fill="#FFB800">sistema</tspan><tspan> que ele revela e volta</tspan></text><text x="1292" y="613.04" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>ao caso.</tspan></text></g><g class="a up" style="--d:3.4s;--t:0.7s;"><text x="120" y="880" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Em todas: o </tspan><tspan fill="#FFB800">parágrafo-núcleo</tspan><tspan>, que diz qual é a história e por que ela importa.</tspan></text></g></svg>