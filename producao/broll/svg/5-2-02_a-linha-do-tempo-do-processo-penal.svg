k',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Cada fase, uma palavra</tspan></text></g><g class="a draw" style="--d:0.5s;--t:1.2s;"><path d="M140 560 H1780" stroke="#66666F" stroke-width="4" fill="none" pathLength="1"/></g><g class="a pop" style="--d:1s;--t:0.6s;"><rect x="124" y="544" width="32" height="32" fill="#A9A59C" transform="rotate(45 140 560)"/><path d="M140 532 V490" stroke="#A9A59C" stroke-width="3"/></g><g class="a down" style="--d:1.15s;--t:0.7s;"><text x="140" y="403.68" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Investigado</tspan></text><text x="140" y="443.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Polícia ou MP apuram. Em geral,</tspan></text><text x="140" y="471.18" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>inquérito.</tspan></text></g><g class="a pop" style="--d:1.9s;--t:0.6s;"><rect x="397.3333333333333" y="544" width="32" height="32" fill="#8FB8FF" transform="rotate(45 413.3333333333333 560)"/><path d="M413.3333333333333 588 V630" stroke="#8FB8FF" stroke-width="3"/></g><g class="a up" style="--d:2.05s;--t:0.7s;"><text x="332.42" y="680" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="32" font-weight="400" fill="#8FB8FF" xml:space="preserve"><tspan>Indiciado</tspan></text><text x="254.04" y="720" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>O delegado aponta o provável</tspan></text><text x="294.28" y="747.5" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>autor. Lei 12.830/2013.</tspan></text></g><g class="a pop" style="--d:2.8s;--t:0.6s;"><rect x="670.6666666666666" y="544" width="32" height="32" fill="#8FB8FF" transform="rotate(45 686.6666666666666 560)"/><path d="M686.6666666666666 532 V490" stroke="#8FB8FF" stroke-width="3"/></g><g class="a down" style="--d:2.95s;--t:0.7s;"><text x="583.51" y="403.68" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="32" font-weight="400" fill="#8FB8FF" xml:space="preserve"><tspan>Denunciado</tspan></text><text x="512.27" y="443.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>O MP oferece a acusação formal.</tspan></text><text x="625.4" y="471.18" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>CPP, art. 41.</tspan></text></g><g class="a pop" style="--d:3.7s;--t:0.6s;"><rect x="944" y="544" width="32" height="32" fill="#FFB800" transform="rotate(45 960 560)"/><path d="M960 588 V630" stroke="#FFB800" stroke-width="3"/></g><g class="a up" style="--d:3.85s;--t:0.7s;"><text x="926.21" y="680" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="32" font-weight="400" fill="#FFB800" xml:space="preserve"><tspan>Réu</tspan></text><text x="772.88" y="720" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>O juiz recebe a denúncia. Começa a</tspan></text><text x="899.01" y="747.5" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>ação penal.</tspan></text></g><g class="a pop" style="--d:4.6s;--t:0.6s;"><rect x="1217.3333333333333" y="544" width="32" height="32" fill="#FFB800" transform="rotate(45 1233.3333333333333 560)"/><path d="M1233.3333333333333 532 V490" stroke="#FFB800" stroke-width="3"/></g><g class="a down" style="--d:4.75s;--t:0.7s;"><text x="1130.04" y="403.68" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="32" font-weight="400" fill="#FFB800" xml:space="preserve"><tspan>1ª instância</tspan></text><text x="1099.49" y="443.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Sentença: condenado ou</tspan></text><text x="1103.21" y="471.18" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>absolvido. Cabe recurso.</tspan></text></g><g class="a pop" style="--d:5.5s;--t:0.6s;"><rect x="1490.6666666666667" y="544" width="32" height="32" fill="#FFB800" transform="rotate(45 1506.6666666666667 560)"/><path d="M1506.6666666666667 588 V630" stroke="#FFB800" stroke-width="3"/></g><g class="a up" style="--d:5.65s;--t:0.7s;"><text x="1403.37" y="680" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="32" font-weight="400" fill="#FFB800" xml:space="preserve"><tspan>2ª instância</tspan></text><text x="1335.89" y="720" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Acórdão do tribunal. Pode haver</tspan></text><text x="1377.38" y="747.5" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>recurso ao STJ e ao STF.</tspan></text></g><g class="a pop" style="--d:6.4s;--t:0.6s;"><rect x="1764" y="544" width="32" height="32" fill="#FF6B5E" transform="rotate(45 1780 560)"/><path d="M1780 532 V490" stroke="#FF6B5E" stroke-width="3"/></g><g class="a down" style="--d:6.55s;--t:0.7s;"><text x="1431.55" y="403.68" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="32" font-weight="400" fill="#FF6B5E" xml:space="preserve"><tspan>Trânsito em julgado</tspan></text><text x="1458.91" y="443.68" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Não cabe mais recurso. Só aí a</tspan></text><text x="1515.93" y="471.18" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>condenação é definitiva.</tspan></text></g><g class="a fade" style="--d:8s;--t:0.7s;"><text x="120" y="960" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="26" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Terminada a investigação, o MP pode arquivar, propor acordo ou denunciar.</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Conteúdo educativo. Não substitui advogado no caso concreto.</tspan></text></g></svg>