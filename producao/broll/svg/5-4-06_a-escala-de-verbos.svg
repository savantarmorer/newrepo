<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" data-dur="8.2" data-id="5.4-06"><style>@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Grotesk:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=block');.a{animation-duration:var(--t);animation-delay:var(--d);animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1)}.fade{animation-name:k-fade}.up{animation-name:k-up}.down{animation-name:k-down}.left{animation-name:k-left}.right{animation-name:k-right}.pop{animation-name:k-pop;transform-box:fill-box;transform-origin:center}.stamp{animation-name:k-stamp;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.3,1.4,.5,1)}.draw{animation-name:k-draw;stroke-dasharray:1;stroke-dashoffset:1;animation-timing-function:cubic-bezier(.6,0,.3,1)}.draw path,.draw line,.draw polyline,.draw rect,.draw circle{stroke-dasharray:1 1}.grow{animation-name:k-grow;transform-box:fill-box;transform-origin:left center}.growY{animation-name:k-growY;transform-box:fill-box;transform-origin:center bottom}.uncover{animation-name:k-uncover;transform-box:fill-box;transform-origin:right center;animation-timing-function:cubic-bezier(.7,0,.2,1)}.dim{animation-name:k-dim}.gone{animation-name:k-gone}.shake{animation-name:k-shake;animation-timing-function:linear}.drop{animation-name:k-drop;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.5,0,.9,.5)}.zoom{animation-name:k-zoom;transform-box:view-box;animation-timing-function:cubic-bezier(.6,0,.2,1)}.pulse{animation-name:k-pulse;transform-box:fill-box;transform-origin:center;animation-iteration-count:2}.slideL{animation-name:k-slideL}.slideR{animation-name:k-slideR}.spin{animation-name:k-spin;transform-box:view-box;animation-timing-function:linear}@keyframes k-fade{from{opacity:0}to{opacity:1}}@keyframes k-up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 5.4 · CHECAGEM E REDAÇÃO</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>A escala de verbos</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><text x="120" y="269.6" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Do mais forte ao mais fraco. Cada degrau pede um tipo de prova.</tspan></text></g><g class="a grow" style="--d:0.8s;--t:0.7s;"><rect x="120" y="370" width="1680" height="92" fill="#4ADE80" fill-opacity=".16"/><rect x="120" y="370" width="10" height="92" fill="#4ADE80"/></g><g class="a fade" style="--d:1.1s;--t:0.7s;"><text x="156" y="428" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>“Recebeu”, “assinou”, “pagou”</tspan></text><text x="1525.2" y="428" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#4ADE80" xml:space="preserve"><tspan>o documento prova</tspan></text></g><g class="a grow" style="--d:1.5s;--t:0.7s;"><rect x="120" y="480" width="1560" height="92" fill="#8FB8FF" fill-opacity=".16"/><rect x="120" y="480" width="10" height="92" fill="#8FB8FF"/></g><g class="a fade" style="--d:1.8s;--t:0.7s;"><text x="156" y="538" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>“Teria recebido, segundo X”</tspan></text><text x="1419.6" y="538" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#8FB8FF" xml:space="preserve"><tspan>versão atribuída</tspan></text></g><g class="a grow" style="--d:2.2s;--t:0.7s;"><rect x="120" y="590" width="1440" height="92" fill="#FFB800" fill-opacity=".16"/><rect x="120" y="590" width="10" height="92" fill="#FFB800"/></g><g class="a fade" style="--d:2.5s;--t:0.7s;"><text x="156" y="648" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>“É investigado por”, “foi denunciado por”</tspan></text><text x="954" y="648" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#FFB800" xml:space="preserve"><tspan>fase formal, com o processo identificado</tspan></text></g><g class="a grow" style="--d:2.9s;--t:0.7s;"><rect x="120" y="700" width="1320" height="92" fill="#A9A59C" fill-opacity=".16"/><rect x="120" y="700" width="10" height="92" fill="#A9A59C"/></g><g class="a fade" style="--d:3.2s;--t:0.7s;"><text x="156" y="758" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>“Não explicou”, “não respondeu”</tspan></text><text x="1136.4" y="758" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#A9A59C" xml:space="preserve"><tspan>o fato é o silêncio</tspan></text></g><g class="a fade" style="--d:3.8s;--t:0.7s;"><text x="120" y="850" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FF6B5E" letter-spacing="3.08" xml:space="preserve"><tspan>FORA DO ROTEIRO, SEM CONDENAÇÃO OU PROVA DIRETA</tspan></text></g><g class="a pop" style="--d:4s;--t:0.6s;"><rect x="120" y="889.6" width="129.6" height="40.8" fill="none" stroke="#FF6B5E" stroke-width="2.5"/><text x="134.4" y="918.64" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#FF6B5E" xml:space="preserve"><tspan>desviou</tspan></text></g><g class="a pop" style="--d:4.2s;--t:0.6s;"><rect x="265.6" y="889.6" width="115.2" height="40.8" fill="none" stroke="#FF6B5E" stroke-width="2.5"/><text x="280" y="918.64" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#FF6B5E" xml:space="preserve"><tspan>roubou</tspan></text></g><g class="a pop" style="--d:4.4s;--t:0.6s;"><rect x="396.8" y="889.6" width="129.6" height="40.8" fill="none" stroke="#FF6B5E" stroke-width="2.5"/><text x="411.2" y="918.64" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#FF6B5E" xml:space="preserve"><tspan>esquema</tspan></text></g><g class="a pop" style="--d:4.6s;--t:0.6s;"><rect x="542.4" y="889.6" width="158.4" height="40.8" fill="none" stroke="#FF6B5E" stroke-width="2.5"/><text x="556.8" y="918.64" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#FF6B5E" xml:space="preserve"><tspan>quadrilha</tspan></text></g><g class="a pop" style="--d:4.8s;--t:0.6s;"><rect x="716.8" y="889.6" width="360" height="40.8" fill="none" stroke="#FF6B5E" stroke-width="2.5"/><text x="731.2" y="918.64" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#FF6B5E" xml:space="preserve"><tspan>“laranja” como acusação</tspan></text></g><g class="a pop" style="--d:5s;--t:0.6s;"><rect x="1092.8" y="889.6" width="244.8" height="40.8" fill="none" stroke="#FF6B5E" stroke-width="2.5"/><text x="1107.2" y="918.64" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#FF6B5E" xml:space="preserve"><tspan>comprovadamente</tspan></text></g><g class="a pop" style="--d:5.2s;--t:0.6s;"><rect x="1353.6" y="889.6" width="172.8" height="40.8" fill="none" stroke="#FF6B5E" stroke-width="2.5"/><text x="1368" y="918.64" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#FF6B5E" xml:space="preserve"><tspan>sem dúvida</tspan></text></g></svg>