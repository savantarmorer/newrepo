}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 3.3 · PRAZOS E RECURSOS</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Fora do governo federal</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><text x="120" y="269.6" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Os prazos são os mesmos: 20 mais 10. Os degraus de recurso quem define é a norma local.</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><rect x="120" y="400" width="536" height="340" fill="#141416" stroke="#FFB800" stroke-width="3"/><rect x="120" y="400" width="536" height="10" fill="#FFB800"/><g transform="translate(148,436) scale(1.13)" fill="none" stroke="#FFB800" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><path d="M6 42 H42 M10 42 V18 H38 V42 M6 18 L24 6 L42 18 M16 24 V36 M24 24 V36 M32 24 V36" /></g><text x="148" y="538.4" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="36" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Ministério Público</tspan></text><text x="148" y="595.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Representação quando o</tspan></text><text x="148" y="634.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>sistema local simplesmente não</tspan></text><text x="148" y="673.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>funciona.</tspan></text></g><g class="a up" style="--d:1.2s;--t:0.7s;"><rect x="692" y="400" width="536" height="340" fill="#141416" stroke="#FFB800" stroke-width="3"/><rect x="692" y="400" width="536" height="10" fill="#FFB800"/><g transform="translate(720,436) scale(1.13)" fill="none" stroke="#FFB800" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6 V42 M12 42 H36 M8 12 H40 M8 12 L2 26 H14 Z M40 12 L34 26 H46 Z" /></g><text x="720" y="538.4" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="36" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Tribunal de contas</tspan></text><text x="720" y="595.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Representação ao órgão que</tspan></text><text x="720" y="634.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>fiscaliza as contas do ente.</tspan></text></g><g class="a up" style="--d:2s;--t:0.7s;"><rect x="1264" y="400" width="536" height="340" fill="#141416" stroke="#FFB800" stroke-width="3"/><rect x="1264" y="400" width="536" height="10" fill="#FFB800"/><g transform="translate(1292,436) scale(1.13)" fill="none" stroke="#FFB800" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8 L34 22 M14 14 L28 28 M17 11 L31 25 M24 25 L40 41 M6 42 H26" /></g><text x="1292" y="538.4" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="36" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Mandado de segurança</tspan></text><text x="1292" y="595.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Com advogado: a ação para</tspan></text><text x="1292" y="634.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>proteger um direito claro contra</tspan></text><text x="1292" y="673.88" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>ato ilegal de autoridade.</tspan></text></g><g class="a 