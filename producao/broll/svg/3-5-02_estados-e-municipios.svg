<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" data-dur="5.9" data-id="3.5-02"><style>@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Grotesk:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=block');.a{animation-duration:var(--t);animation-delay:var(--d);animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1)}.fade{animation-name:k-fade}.up{animation-name:k-up}.down{animation-name:k-down}.left{animation-name:k-left}.right{animation-name:k-right}.pop{animation-name:k-pop;transform-box:fill-box;transform-origin:center}.stamp{animation-name:k-stamp;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.3,1.4,.5,1)}.draw{animation-name:k-draw;stroke-dasharray:1;stroke-dashoffset:1;animation-timing-function:cubic-bezier(.6,0,.3,1)}.draw path,.draw line,.draw polyline,.draw rect,.draw circle{stroke-dasharray:1 1}.grow{animation-name:k-grow;transform-box:fill-box;transform-origin:left center}.growY{animation-name:k-growY;transform-box:fill-box;transform-origin:center bottom}.uncover{animation-name:k-uncover;transform-box:fill-box;transform-origin:right center;animation-timing-function:cubic-bezier(.7,0,.2,1)}.dim{animation-name:k-dim}.gone{animation-name:k-gone}.shake{animation-name:k-shake;animation-timing-function:linear}.drop{animation-name:k-drop;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.5,0,.9,.5)}.zoom{animation-name:k-zoom;transform-box:view-box;animation-timing-function:cubic-bezier(.6,0,.2,1)}.pulse{animation-name:k-pulse;transform-box:fill-box;transform-origin:center;animation-iteration-count:2}.slideL{animation-name:k-slideL}.slideR{animation-name:k-slideR}.spin{animation-name:k-spin;transform-box:view-box;animation-timing-function:linear}@keyframes k-fade{from{opacity:0}to{opacity:1}}@keyframes k-up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes k-down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}@keyframes k-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}@keyframes k-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}@keyframes k-pop{0%{opacity:0;transform:scale(.82)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}@keyframes k-stamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}@keyframes k-draw{to{stroke-dashoffset:0}}@keyframes k-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes k-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes k-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes k-dim{from{opacity:1}to{opacity:.16}}@keyframes k-gone{from{opacity:1}to{opacity:0}}@keyframes k-shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}@keyframes k-drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(260px) rotate(14deg)}}@keyframes k-zoom{from{transform:none}to{transform:var(--z)}}@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes k-slideL{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}@keyframes k-spin{from{transform:rotate(0)}to{transform:rotate(var(--r))}}@keyframes k-slideR{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}</style><rect width="1920" height="1080" fill="#0C0C0D"/><g class="a fade" style="--d:0s;--t:0.5s;"><rect x="120" y="84" width="14" height="14" fill="#FFB800"/><text x="150" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#FFB800" letter-spacing="3.08" xml:space="preserve"><tspan>AULA 3.5 · ESTADOS, MUNICÍPIOS E CASOS</tspan></text></g><g class="a up" style="--d:0.15s;--t:0.7s;"><text x="120" y="205" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="70" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Estados e municípios</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><text x="120" y="269.6" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>A LAI é lei nacional. Mas o art. 45 manda cada ente definir quem responde, quem julga recurso e</tspan></text><text x="120" y="313.8" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>quantos degraus existem.</tspan></text></g><g class="a up" style="--d:0.4s;--t:0.7s;"><rect x="120" y="420" width="536" height="452.42" fill="#141416" stroke="#8FB8FF" stroke-width="3"/><rect x="120" y="420" width="536" height="10" fill="#8FB8FF"/><g transform="translate(148,456) scale(1.13)" fill="none" stroke="#8FB8FF" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19"/><path d="M5 24 H43 M24 5 C14 16 14 32 24 43 M24 5 C34 16 34 32 24 43" /></g><text x="148" y="554.8" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="32" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Aderiu ao sistema federal</tspan></text><text x="148" y="609.76" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Alguns estados e muitas</tspan></text><text x="148" y="646.16" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>prefeituras usam o sistema federal</tspan></text><text x="148" y="682.56" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>de pedidos.</tspan></text></g><g class="a up" style="--d:1.3s;--t:0.7s;"><rect x="692" y="420" width="536" height="452.42" fill="#141416" stroke="#FFB800" stroke-width="3"/><rect x="692" y="420" width="536" height="10" fill="#FFB800"/><g transform="translate(720,456) scale(1.13)" fill="none" stroke="#FFB800" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><path d="M6 42 H42 M10 42 V18 H38 V42 M6 18 L24 6 L42 18 M16 24 V36 M24 24 V36 M32 24 V36" /></g><text x="720" y="554.8" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="32" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Tem sistema próprio</tspan></text><text x="720" y="609.76" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>No site do órgão, procure “Acesso</tspan></text><text x="720" y="646.16" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>à Informação”, “e-SIC” ou “SIC”, o</tspan></text><text x="720" y="682.56" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Serviço de Informação ao Cidadão.</tspan></text></g><g class="a up" style="--d:2.2s;--t:0.7s;"><rect x="1264" y="420" width="536" height="452.42" fill="#141416" stroke="#FF6B5E" stroke-width="3"/><rect x="1264" y="420" width="536" height="10" fill="#FF6B5E"/><g transform="translate(1292,456) scale(1.13)" fill="none" stroke="#FF6B5E" stroke-width="3.11" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="38" height="26" rx="2"/><path d="M5 13 L24 27 L43 13" /></g><text x="1292" y="554.8" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="32" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Não tem nada funcionando</tspan></text><text x="1292" y="609.76" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Protocole mesmo assim: e-mail</tspan></text><text x="1292" y="646.16" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>oficial ou papel, com comprovante.</tspan></text><text x="1292" y="682.56" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>Anote data, nome de quem</tspan></text><text x="1292" y="718.96" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>recebeu e guarde cópia.</tspan></text></g><g class="a fade" style="--d:2.7s;--t:0.7s;"><text x="1292" y="838.42" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="25.2" font-weight="700" fill="#FF6B5E" xml:space="preserve"><tspan>Sem norma local, a LAI se aplica direto.</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Lei 12.527/2011, a Lei de Acesso à Informação · regras válidas em setembro de 2026</tspan></text></g></svg>