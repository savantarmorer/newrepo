,'Arial Black',Impact,sans-serif" font-size="36" font-weight="400" fill="#1C1A17" xml:space="preserve"><tspan>nem nome, nem foto,</tspan></text><text x="210" y="721.4" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="36" font-weight="400" fill="#1C1A17" xml:space="preserve"><tspan>nem apelido, nem iniciais</tspan></text></g><g class="a up" style="--d:0.6s;--t:0.7s;"><text x="900" y="290" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="40" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Adolescente a quem se atribua ato</tspan></text><text x="900" y="334" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="40" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>infracional</tspan></text></g><g class="a up" style="--d:1.1s;--t:0.7s;"><text x="900" y="420" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>A notícia não pode identificá-lo. É uma linha que não se</tspan></text><text x="900" y="460.96" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="400" fill="#A9A59C" xml:space="preserve"><tspan>cruza.</tspan></text></g><g class="a fade" style="--d:4.2s;--t:0.7s;"><text x="900" y="560" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#FFB800" letter-spacing="3.36" xml:space="preserve"><tspan>PARA TODO O RESTO, A MESMA PERGUNTA</tspan></text></g><g class="a up" style="--d:4.6s;--t:0.7s;"><text x="900" y="630" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="36" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>Vítima, pessoa vulnerável, terceiro sem</tspan></text><text x="900" y="675" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="36" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan>relevância pública: </tspan><tspan fill="#FFB800">expor essa pessoa é</tspan></text><text x="900" y="720" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="36" font-weight="700" fill="#F4F1EA" xml:space="preserve"><tspan fill="#FFB800">necessário para o interesse público da matéria?</tspan></text></g><g class="a up" style="--d:5.6s;--t:0.7s;"><text x="900" y="880" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="44" font-weight="400" fill="#F4F1EA" xml:space="preserve"><tspan>Se não é, não exponha.</tspan></text></g><g class="a fade" style="--d:0.4s;--t:0.6s;"><text x="120" y="1010" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="400" fill="#8A867D" xml:space="preserve"><tspan>Estatuto da Criança e do Adolescente, art. 143</tspan></text></g></svg>