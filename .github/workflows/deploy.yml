name: Deploy para iuripiragibe.net

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secrets FTP
        id: ftp
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$SERVER" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "FTP_SERVER ausente. O site público é o Netlify; o deploy FTP fica desligado até cadastrar os secrets."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ftp.outputs.skip != 'true'

      - name: Deploy via FTP
        if: steps.ftp.outputs.skip != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/test-results/**
            **/tests/**
            **/scripts/**
            **/lib/**
            **/server.js
            **/package*.json
            **/vercel.json
            **/playwright*.ts
            **/*.md
            **/DEPLOY.md
            **/README*
            **/newrepo-0.md
            agora-slu/supabase/**
            jornalismo/supabase/**
