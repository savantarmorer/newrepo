<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jarro de Presentes • TikTok LIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --gold:#F3C969;
    --gold-deep:#C9972F;
    --violet:#9B6BE8;
    --violet-deep:#4C2A86;
    --cream:#F6EFDD;
    --ink:#141021;
    --panel:rgba(22,17,34,.72);
    --pink:#FE2C55; /* toque TikTok, só no coração da chamada */
    --w:340px;              /* largura do widget */
    --jar-h:360px;          /* altura do corpo do jarro */
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden}
  /* Fundo TRANSPARENTE por padrão (essencial para o OBS). */
  body{
    background:transparent;
    font-family:'Inter',system-ui,sans-serif;
    color:var(--cream);
    -webkit-font-smoothing:antialiased;
  }
  /* Em modo demonstração/prévia mostramos um fundo escuro só para dar pra ver. */
  body.demo{
    background:
      radial-gradient(1200px 800px at 50% 30%, #1a1230 0%, #0c0916 60%, #070510 100%);
  }

  .stage{
    position:fixed; inset:0;
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:24px;
  }

  .widget{
    width:var(--w);
    display:flex; flex-direction:column; align-items:center; gap:14px;
    filter:drop-shadow(0 18px 40px rgba(0,0,0,.45));
  }

  /* ---------- Chamada (incentivo a presentear) ---------- */
  .cta{
    width:100%;
    text-align:center;
    padding:11px 16px;
    border-radius:14px;
    background:linear-gradient(180deg, rgba(243,201,105,.16), rgba(155,107,232,.16));
    border:1px solid rgba(243,201,105,.38);
    backdrop-filter:blur(8px);
    position:relative;
    animation:ctaPulse 2.4s ease-in-out infinite;
  }
  .cta b{color:var(--gold); font-weight:800}
  .cta .heart{color:var(--pink); animation:beat 1.1s ease-in-out infinite; display:inline-block}
  .cta small{display:block; margin-top:2px; font-size:12px; letter-spacing:.02em; color:rgba(246,239,221,.72)}
  @keyframes ctaPulse{
    0%,100%{transform:translateY(0); box-shadow:0 0 0 rgba(243,201,105,0)}
    50%{transform:translateY(-2px); box-shadow:0 0 26px rgba(243,201,105,.28)}
  }
  @keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.28)}}

  /* ---------- Jarro ---------- */
  .jar-wrap{position:relative; width:250px; height:calc(var(--jar-h) + 34px)}

  .jar-lid{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:150px; height:34px; z-index:5;
  }
  .jar-lid::before{ /* aro dourado */
    content:""; position:absolute; inset:0;
    border-radius:12px 12px 6px 6px;
    background:linear-gradient(180deg,#ffe6a3,#e0ab41 45%,#a9781f);
    box-shadow:inset 0 2px 3px rgba(255,255,255,.6), 0 4px 10px rgba(0,0,0,.35);
  }
  .jar-lid::after{ /* pescoço de vidro */
    content:""; position:absolute; left:50%; bottom:-12px; transform:translateX(-50%);
    width:120px; height:20px; border-radius:0 0 12px 12px;
    background:linear-gradient(180deg, rgba(220,230,255,.28), rgba(200,215,255,.10));
    border:1px solid rgba(255,255,255,.28); border-top:none;
  }

  .jar{
    position:absolute; top:30px; left:50%; transform:translateX(-50%);
    width:230px; height:var(--jar-h);
    border-radius:34px 34px 42px 42px / 26px 26px 46px 46px;
    background:linear-gradient(115deg, rgba(255,255,255,.14), rgba(255,255,255,.03) 40%, rgba(255,255,255,.10));
    border:1.5px solid rgba(255,255,255,.34);
    box-shadow:
      inset 0 2px 10px rgba(255,255,255,.35),
      inset 0 -18px 40px rgba(76,42,134,.22),
      0 10px 30px rgba(0,0,0,.35);
    overflow:hidden;
  }

  .jar-interior{position:absolute; inset:8px; border-radius:28px 28px 38px 38px; overflow:hidden}

  /* líquido que sobe conforme a meta enche */
  .liquid{
    position:absolute; left:0; right:0; bottom:0; height:0%;
    background:linear-gradient(180deg,#b98cf0 0%, #7b3fb0 42%, #3d1f66 100%);
    transition:height 1.2s cubic-bezier(.22,1,.36,1);
    box-shadow:0 -1px 18px rgba(155,107,232,.5);
  }
  .liquid::before{ /* brilho da superfície */
    content:""; position:absolute; top:-2px; left:0; right:0; height:10px;
    background:linear-gradient(180deg, rgba(243,201,105,.95), rgba(243,201,105,0));
    filter:blur(.5px);
  }
  .wave{
    position:absolute; top:-14px; left:-25%; width:150%; height:26px;
    background:radial-gradient(60% 100% at 50% 100%, rgba(243,201,105,.5), transparent 70%);
  }
  .wave.w1{animation:sway 4.5s ease-in-out infinite}
  .wave.w2{animation:sway 6.5s ease-in-out infinite reverse; opacity:.6}
  @keyframes sway{0%,100%{transform:translateX(-6%)}50%{transform:translateX(6%)}}

  .bubbles{position:absolute; inset:0; pointer-events:none}
  .bubble{
    position:absolute; bottom:0; width:7px; height:7px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(243,201,105,.35));
    opacity:0; animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) scale(.6); opacity:0}
    15%{opacity:.9}
    100%{transform:translateY(-220px) scale(1); opacity:0}
  }

  /* camada dos presentes (imagens) dentro do jarro */
  .tokens{position:absolute; inset:0; pointer-events:none}
  .token{
    position:absolute; width:46px; height:46px; bottom:0;
    transform:translateX(-50%);
    transition:bottom .9s cubic-bezier(.22,1,.36,1);
    animation:bob 3.2s ease-in-out infinite;
  }
  .token .disc{
    width:100%; height:100%; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:26px; line-height:1;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.9), rgba(243,201,105,.25) 60%, rgba(76,42,134,.35));
    border:1.5px solid rgba(255,255,255,.55);
    box-shadow:0 6px 14px rgba(0,0,0,.35);
    overflow:hidden;
  }
  .token img{width:78%; height:78%; object-fit:contain; border-radius:50%}
  .token.drop{animation:drop .7s cubic-bezier(.3,1.4,.5,1) 1, bob 3.2s ease-in-out infinite .7s}
  @keyframes drop{0%{transform:translate(-50%,-330px) scale(.4) rotate(-20deg); opacity:0}
    60%{opacity:1}
    100%{transform:translate(-50%,0) scale(1) rotate(0)}}
  @keyframes bob{0%,100%{margin-bottom:0}50%{margin-bottom:8px}}
  .token.fade{opacity:0; transition:opacity .6s}

  .glass-shine{
    position:absolute; top:14px; left:20px; width:34px; height:66%;
    border-radius:40px; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0));
    filter:blur(1px);
  }

  /* selo de porcentagem sobre o jarro */
  .goal-badge{
    position:absolute; top:44px; left:50%; transform:translateX(-50%);
    z-index:6; text-align:center; pointer-events:none;
  }
  .goal-badge .pct{
    font-family:'Cinzel',serif; font-weight:700; font-size:30px; color:#fff;
    text-shadow:0 2px 10px rgba(76,42,134,.8), 0 0 18px rgba(243,201,105,.5);
  }
  .goal-badge .lvl{
    font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--gold); opacity:.9;
  }

  /* ---------- Estatísticas / meta ---------- */
  .stats{
    width:100%; padding:13px 16px; border-radius:16px;
    background:var(--panel); border:1px solid rgba(243,201,105,.28);
    backdrop-filter:blur(10px);
  }
  .title{
    font-family:'Cinzel',serif; font-weight:700; letter-spacing:.14em;
    font-size:15px; text-align:center; color:var(--gold); margin-bottom:10px;
  }
  .row{display:flex; gap:10px; margin-bottom:11px}
  .stat{
    flex:1; text-align:center; padding:8px 4px; border-radius:11px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
  }
  .stat .n{font-size:20px; font-weight:800; color:#fff; line-height:1}
  .stat .l{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(246,239,221,.6); margin-top:4px}

  .progress{height:12px; border-radius:8px; background:rgba(255,255,255,.08); overflow:hidden; position:relative}
  .progress .fill{
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--violet), var(--gold));
    transition:width 1.1s cubic-bezier(.22,1,.36,1);
    box-shadow:0 0 12px rgba(243,201,105,.6);
  }
  .goal-line{display:flex; justify-content:space-between; margin-top:7px; font-size:11px; color:rgba(246,239,221,.72)}
  .goal-line b{color:var(--gold)}

  /* ---------- Toast do último presente ---------- */
  .toast{
    position:absolute; top:-6px; left:50%; transform:translate(-50%,-100%) scale(.9);
    min-width:220px; max-width:300px;
    display:flex; align-items:center; gap:10px;
    padding:9px 13px; border-radius:13px;
    background:linear-gradient(180deg, rgba(243,201,105,.22), rgba(155,107,232,.20));
    border:1px solid rgba(243,201,105,.5);
    backdrop-filter:blur(10px);
    opacity:0; pointer-events:none;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .toast.show{animation:toastIn .5s forwards, toastOut .5s forwards 4s}
  @keyframes toastIn{to{opacity:1; transform:translate(-50%,-100%) scale(1)}}
  @keyframes toastOut{to{opacity:0; transform:translate(-50%,-115%) scale(.95)}}
  .toast .av{width:34px; height:34px; border-radius:50%; object-fit:cover; border:1.5px solid var(--gold); background:#2a2140; flex:none}
  .toast .tx{font-size:12px; line-height:1.35; text-align:left}
  .toast .tx .u{font-weight:800; color:#fff}
  .toast .tx .g{color:var(--gold)}
  .toast .tx .v{color:#fff; font-weight:800}

  /* selo de prévia */
  .demo-badge{
    position:fixed; top:12px; left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    color:rgba(246,239,221,.65); background:rgba(0,0,0,.4);
    padding:5px 12px; border-radius:20px; border:1px solid rgba(255,255,255,.12);
    display:none;
  }
  body.demo .demo-badge{display:block}

  /* confete da meta batida */
  .confetti-layer{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:20}
  .confetti{position:absolute; width:9px; height:14px; border-radius:2px; opacity:0}
  .flash{
    position:fixed; inset:0; pointer-events:none; z-index:19;
    background:radial-gradient(circle at 50% 70%, rgba(243,201,105,.5), transparent 60%);
    opacity:0;
  }
  .flash.go{animation:flash 1.6s ease-out}
  @keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important}
  }
</style>
</head>
<body>
  <div class="demo-badge">Prévia • modo demonstração</div>
  <div class="flash" id="flash"></div>
  <div class="confetti-layer" id="confetti"></div>

  <div class="stage">
    <div class="widget">

      <div class="cta">
        <span>Envie um <b>presente</b> <span class="heart">♥</span> e ajude a encher o jarro!</span>
        <small id="ctaSub">Cada presente sobe o nível da live</small>
      </div>

      <div class="jar-wrap">
        <div class="toast" id="toast">
          <img class="av" id="toastAv" alt="" />
          <div class="tx" id="toastTx"></div>
        </div>

        <div class="jar-lid"></div>
        <div class="goal-badge">
          <div class="pct" id="pct">0%</div>
          <div class="lvl" id="lvl">Nível 1</div>
        </div>

        <div class="jar">
          <div class="jar-interior">
            <div class="liquid" id="liquid">
              <div class="wave w1"></div>
              <div class="wave w2"></div>
            </div>
            <div class="bubbles" id="bubbles"></div>
            <div class="tokens" id="tokens"></div>
          </div>
          <div class="glass-shine"></div>
        </div>
      </div>

      <div class="stats">
        <div class="title" id="title">🎁 JARRO DE PRESENTES</div>
        <div class="row">
          <div class="stat"><div class="n" id="nDiamonds">0</div><div class="l">💎 Diamantes</div></div>
          <div class="stat"><div class="n" id="nGifts">0</div><div class="l">🎁 Presentes</div></div>
        </div>
        <div class="progress"><div class="fill" id="progressFill"></div></div>
        <div class="goal-line">
          <span>Meta: <b id="goalTarget">2000</b> 💎</span>
          <span>Faltam <b id="goalLeft">2000</b> 💎</span>
        </div>
      </div>

    </div>
  </div>

<script>
/* ============================================================
   CONFIGURAÇÃO (via parâmetros de URL, todos opcionais)
   ?demo=1        -> modo demonstração (presentes simulados)
   ?meta=2000     -> diamantes por nível
   ?titulo=Texto  -> título do painel
   ?user=@nome    -> só exibição (a conexão real é feita pelo servidor)
   ============================================================ */
const params   = new URLSearchParams(location.search);
const FORCE_DEMO = params.get('demo') === '1';
const META     = Math.max(50, parseInt(params.get('meta') || '2000', 10));
const TITULO   = params.get('titulo');
if (TITULO) document.getElementById('title').textContent = TITULO;

const MAX_TOKENS = 18;

const el = (id)=>document.getElementById(id);
const liquid=el('liquid'), tokensLayer=el('tokens'), bubbles=el('bubbles');
const interior=document.querySelector('.jar-interior');

let state = { total:0, count:0, level:1, levelBase:0, goal:META };
let tokens = [];

/* presentes de demonstração (emoji no lugar da imagem real da TikTok) */
const DEMO_GIFTS = [
  {giftName:'Rosa', emoji:'🌹', coins:1,  users:['@lua_','@marcosfsc','@bruxa.digital']},
  {giftName:'Coração', emoji:'💗', coins:5, users:['@ana.paula','@dev_rj']},
  {giftName:'TikTok', emoji:'🎵', coins:1, users:['@iuri.fan','@sol']},
  {giftName:'Sorvete', emoji:'🍦', coins:1, users:['@pedrinho','@vitoria_']},
  {giftName:'Chapéu', emoji:'🎩', coins:99, users:['@ocultista','@ordem']},
  {giftName:'Galáxia', emoji:'🌌', coins:1000, users:['@mecenas','@grande.obra']},
  {giftName:'Leão', emoji:'🦁', coins:2999, users:['@rei.leao','@arauto']},
  {giftName:'Foguete', emoji:'🚀', coins:2000, users:['@astro','@enigma']},
  {giftName:'Diamante', emoji:'💎', coins:250, users:['@joia','@caelum']},
  {giftName:'Buquê', emoji:'💐', coins:100, users:['@jardim','@aurora_']},
];

/* --------- render de nível/meta/estatísticas --------- */
function refresh(){
  const span = state.goal - state.levelBase;
  const inLevel = Math.max(0, state.total - state.levelBase);
  const pct = Math.max(0, Math.min(1, inLevel / span));
  const pctInt = Math.round(pct*100);

  liquid.style.height = (6 + pct*94) + '%';   // nunca 0% pra ficar bonito
  el('progressFill').style.width = pctInt + '%';
  el('pct').textContent = pctInt + '%';
  el('lvl').textContent = 'Nível ' + state.level;
  el('nDiamonds').textContent = state.total.toLocaleString('pt-BR');
  el('nGifts').textContent = state.count.toLocaleString('pt-BR');
  el('goalTarget').textContent = state.goal.toLocaleString('pt-BR');
  el('goalLeft').textContent = Math.max(0, state.goal - state.total).toLocaleString('pt-BR');

  repositionTokens(pct);
}

function repositionTokens(pct){
  const h = interior.clientHeight;
  const surface = 30 + pct*(h*0.92); // px a partir do fundo
  tokens.forEach(t=>{
    if(t._settled) t.el.style.bottom = Math.max(6, surface - 20 + t._jitter) + 'px';
  });
}

/* --------- adiciona um presente --------- */
function addGift(g){
  const value = (g.value != null) ? g.value : (g.coins||0) * (g.count||1);

  // sobe totais
  state.total += value;
  state.count += (g.count || 1);

  // sobe de nível ao bater a meta (pode subir vários de uma vez)
  while (state.total >= state.goal){
    levelUp();
  }

  spawnToken(g);
  showToast(g, value);
  refresh();
}

function spawnToken(g){
  const wrap=document.createElement('div');
  wrap.className='token drop';
  const disc=document.createElement('div');
  disc.className='disc';
  if(g.image){
    const img=document.createElement('img');
    img.src=g.image; img.alt=g.giftName||'';
    img.onerror=()=>{ img.remove(); disc.textContent = g.emoji || '🎁'; };
    disc.appendChild(img);
  }else{
    disc.textContent = g.emoji || '🎁';
  }
  wrap.appendChild(disc);

  const w=interior.clientWidth;
  wrap.style.left = (18 + Math.random()*(w-36)) + 'px';
  wrap._jitter = -12 + Math.random()*24;
  wrap.style.animationDelay = '0s';

  tokensLayer.appendChild(wrap);
  const rec={el:wrap,_jitter:wrap._jitter,_settled:false};
  tokens.push(rec);
  setTimeout(()=>{ rec._settled=true; refresh(); }, 700);

  // limita a quantidade visível
  while(tokens.length > MAX_TOKENS){
    const old=tokens.shift();
    old.el.classList.add('fade');
    setTimeout(()=>old.el.remove(),600);
  }
}

function showToast(g, value){
  const t=el('toast');
  const av=el('toastAv');
  if(g.avatar){ av.src=g.avatar; av.style.display='block'; av.onerror=()=>av.style.display='none'; }
  else av.style.display='none';
  el('toastTx').innerHTML =
    `<span class="u">${escapeHtml(g.user||'Alguém')}</span> enviou ` +
    `<span class="g">${escapeHtml(g.giftName||'um presente')}</span>` +
    (g.count>1?` ×${g.count}`:``) +
    ` <span class="v">+${value.toLocaleString('pt-BR')}💎</span>`;
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
}

function levelUp(){
  state.level += 1;
  state.levelBase = state.goal;
  state.goal += META;
  celebrate();
}

/* --------- meta batida: flash + confete --------- */
function celebrate(){
  const f=el('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  const layer=el('confetti');
  const colors=['#F3C969','#9B6BE8','#FE2C55','#ffffff','#7b3fb0'];
  for(let i=0;i<46;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.background=colors[i%colors.length];
    c.style.left=Math.random()*100+'%';
    const dur=1.6+Math.random()*1.4;
    const delay=Math.random()*.3;
    c.style.animation=`confFall ${dur}s ease-in ${delay}s forwards`;
    c.style.setProperty('--rx',(Math.random()*360)+'deg');
    layer.appendChild(c);
    setTimeout(()=>c.remove(),(dur+delay)*1000+200);
  }
  const sub=el('ctaSub'); const prev=sub.textContent;
  sub.textContent='🎉 META BATIDA! Obrigado! 🎉';
  setTimeout(()=>sub.textContent=prev,4000);
}
const styleConf=document.createElement('style');
styleConf.textContent='@keyframes confFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(var(--rx));opacity:.9}}';
document.head.appendChild(styleConf);

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* --------- bolhas decorativas --------- */
(function seedBubbles(){
  for(let i=0;i<7;i++){
    const b=document.createElement('div'); b.className='bubble';
    b.style.left=(10+Math.random()*80)+'%';
    b.style.animationDuration=(3+Math.random()*3)+'s';
    b.style.animationDelay=(Math.random()*4)+'s';
    bubbles.appendChild(b);
  }
})();

/* ============================================================
   MODO AO VIVO (conecta no servidor) x DEMONSTRAÇÃO
   ============================================================ */
let demoTimer=null;
function enterDemo(){
  if(document.body.classList.contains('demo')) return;
  document.body.classList.add('demo');
  const tick=()=>{
    const base=DEMO_GIFTS[Math.floor(Math.random()*DEMO_GIFTS.length)];
    const count=Math.random()<0.25?(1+Math.floor(Math.random()*9)):1;
    addGift({
      user: base.users[Math.floor(Math.random()*base.users.length)],
      giftName: base.giftName, emoji: base.emoji,
      coins: base.coins, count, avatar:''
    });
    demoTimer=setTimeout(tick, 1400+Math.random()*2600);
  };
  tick();
}
function stopDemo(){ if(demoTimer){clearTimeout(demoTimer); demoTimer=null;} document.body.classList.remove('demo'); }

function connectLive(){
  const s=document.createElement('script');
  s.src='/socket.io/socket.io.js';
  s.onload=()=>{
    try{
      const socket=io({reconnection:true, timeout:4000});
      socket.on('connect', ()=>{ stopDemo(); });
      socket.on('state', (st)=>{ if(st){ state={...state,...st}; refresh(); } });
      socket.on('gift', (g)=>{ addGift(g); });
      socket.on('reset', ()=>{ state={total:0,count:0,level:1,levelBase:0,goal:META};
        tokens.forEach(t=>t.el.remove()); tokens=[]; refresh(); });
      // se não conectar em 3.5s, cai pra demo
      setTimeout(()=>{ if(!socket.connected) enterDemo(); }, 3500);
    }catch(e){ enterDemo(); }
  };
  s.onerror=()=>enterDemo();
  document.head.appendChild(s);
}

refresh();
// Em hospedagem estática (sem servidor Node local) vai direto pro modo demo
