# Configuração da CLI do Supabase para o projeto Ágora (supabase start / db reset / functions serve)
project_id = "agora"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "agora://"
additional_redirect_urls = ["agora://auth/callback", "exp://127.0.0.1:8081/--/auth/callback", "http://localhost:8081/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_expiry = 3600

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = true

[edge_runtime]
enabled = true
policy = "per_worker"

# Webhook do gateway de pagamento é chamado sem JWT do Supabase (autenticado pelo provedor)
[functions.webhook-pagamento]
verify_jwt = false
