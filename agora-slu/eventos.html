<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ágora — Eventos da Egrégora</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/cultus.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  .filters { display:flex; gap:var(--space-2); margin: var(--space-4) 0 var(--space-6); flex-wrap:wrap; }
  .filters button { background:transparent; border:1px solid var(--border-subtle); color:var(--color-text-secondary); padding:var(--space-2) var(--space-4); border-radius:var(--radius-full); font-size:var(--text-xs); text-transform:uppercase; letter-spacing:.05em; cursor:pointer; }
  .filters button.active { border-color:var(--border-active); color:var(--color-text-gold); }
  .ev-card { display:flex; gap:var(--space-4); align-items:flex-start; }
  .ev-date { text-align:center; background:var(--bg-surface-elevated); border-radius:var(--radius-sm); padding:var(--space-2) var(--space-3); min-width:64px; }
  .ev-date .d { font-family:var(--font-display); font-size:var(--text-lg); color:var(--brand-action); line-height:1; }
  .ev-date .m { font-size:var(--text-xs); color:var(--color-text-muted); text-transform:uppercase; }
  .rsvp-btn.going { background:#34D399; color:#0F0E17; }
  #emptyMsg { text-align:center; color:var(--color-text-muted); padding: var(--space-8) 0; }
</style>
</head>
<body>

<nav class="cultus-nav">
  <a class="brand" href="index.html">
    <svg viewBox="0 0 200 200" class="seal-icon"><use href="assets/seals.svg#seal-lux-vael"/></svg>
    ÁGORA <span style="color:var(--color-text-secondary); font-weight:400; font-size:var(--text-xs);">· SLU</span>
  </a>
  <ul>
    <li><a href="index.html">Início</a></li>
    <li><a href="perfil.html">Perfil</a></li>
    <li><a href="discord.html">Discord</a></li>
    <li><a href="provida.html">Pró-Vida</a></li>
    <li><a href="dashboard.html">Painel</a></li>
    <li><a href="tarefas.html">Tarefas</a></li>
    <li><a href="codex.html">Códice</a></li>
    <li><a href="clube-do-livro.html">Clube do Livro</a></li>
    <li><a href="eventos.html" class="active">Eventos</a></li>
    <li><a href="calendario.html">Calendário</a></li>
    <li><a href="governanca.html">Conselho</a></li>
    <li><a href="grafo.html">Grafo</a></li>
  </ul>
  <span id="navAuthSlot"></span>
</nav>

<main class="cultus-shell" style="padding-top:var(--space-6); padding-bottom:var(--space-16);">
  <h1 style="font-size:var(--text-lg);">Eventos da Egrégora</h1>
  <p class="text-secondary" style="max-width:640px;">Ritos, lives de decifração e marcos das 4 Fases da Grande Obra.</p>

  <div class="filters" id="filters">
    <button class="active" data-f="todas">Todas as Fases</button>
    <button data-f="Gênese">Gênese</button>
    <button data-f="Conselho">Conselho</button>
    <button data-f="Fundação">Fundação</button>
    <button data-f="Expansão">Expansão</button>
  </div>

  <div class="grid" id="eventsList" style="gap:var(--space-4);"></div>
</main>

<footer class="cultus-footer">
  Ágora, por SLU — Sociedade das Luzes Ocultas.
</footer>

<script type="module">
import { sb, getSession, montarNavAuth } from './js/agoraAuth.js';

montarNavAuth();
const session = await getSession();
const listEl = document.getElementById('eventsList');

const [{ data: manuais, error: err1 }, { data: doDiscord, error: err2 }] = await Promise.all([
  sb.from('agora_events').select('*'),
  sb.from('agora_discord_events').select('*').neq('status', 'cancelado'),
]);
const error = err1 || err2;

// Normaliza as duas fontes num único formato de exibição
const events = [
  ...(manuais || []).map(ev => ({ id: ev.id, source: 'manual', titulo: ev.titulo, descricao: ev.descricao, fase: ev.fase, data: ev.data_evento, local: ev.local })),
  ...(doDiscord || []).map(ev => ({ id: ev.id, source: 'discord', titulo: ev.titulo, descricao: ev.descricao, fase: null, data: ev.data_inicio, local: ev.local })),
].sort((a, b) => new Date(a.data) - new Date(b.data));

const rsvpTable = { manual: 'agora_event_rsvps', discord: 'agora_discord_event_rsvps' };
const rsvpColumn = { manual: 'event_id', discord: 'event_id' };

let rsvpIds = new Set(); // chaves "source:id"
if (session) {
  const [{ data: m1 }, { data: m2 }] = await Promise.all([
    sb.from('agora_event_rsvps').select('event_id').eq('user_id', session.user.id),
    sb.from('agora_discord_event_rsvps').select('event_id').eq('user_id', session.user.id),
  ]);
  (m1 || []).forEach(r => rsvpIds.add(`manual:${r.event_id}`));
  (m2 || []).forEach(r => rsvpIds.add(`discord:${r.event_id}`));
}

function renderList(items) {
  if (error) { listEl.innerHTML = `<div id="emptyMsg">Não foi possível carregar os eventos (${error.message}).</div>`; return; }
  if (!items.length) { listEl.innerHTML = `<div id="emptyMsg">Nenhum evento nesta fase.</div>`; return; }
  listEl.innerHTML = items.map(ev => {
    const d = new Date(ev.data);
    const key = `${ev.source}:${ev.id}`;
    const going = rsvpIds.has(key);
    return `
    <div class="card ev-card" data-key="${key}">
      <div class="ev-date">
        <div class="d">${d.getDate()}</div>
        <div class="m">${d.toLocaleString('pt-BR', { month: 'short' })}</div>
      </div>
      <div style="flex:1;">
        <span class="badge">${ev.fase || (ev.source === 'discord' ? 'Sincronizado do Discord' : 'Egrégora')}</span>
        <h3 style="font-size:var(--text-md); margin:var(--space-2) 0 4px;">${ev.titulo}</h3>
        <p class="text-secondary" style="font-size:var(--text-sm);">${ev.descricao || ''}</p>
        <p class="text-muted" style="font-size:var(--text-xs); margin-top:var(--space-2);">${d.toLocaleString('pt-BR', { dateStyle: 'long', timeStyle: 'short' })} · ${ev.local || 'Discord da Ágora'}</p>
      </div>
      <button class="btn btn-secondary rsvp-btn ${going ? 'going' : ''}" data-key="${key}">
        ${going ? '✓ Presença' : 'Confirmar'}
      </button>
    </div>`;
  }).join('');

  listEl.querySelectorAll('.rsvp-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!session) { window.location.href = 'login.html?next=eventos.html'; return; }
      const [source, id] = btn.dataset.key.split(':');
      const table = rsvpTable[source];
      const going = btn.classList.contains('going');
      btn.disabled = true;
      if (going) {
        await sb.from(table).delete().eq('event_id', id).eq('user_id', session.user.id);
        btn.classList.remove('going'); btn.textContent = 'Confirmar'; rsvpIds.delete(btn.dataset.key);
      } else {
        await sb.from(table).insert({ event_id: id, user_id: session.user.id });
        btn.classList.add('going'); btn.textContent = '✓ Presença'; rsvpIds.add(btn.dataset.key);
      }
      btn.disabled = false;
    });
  });
}

renderList(events);

document.getElementById('filters').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  const f = e.target.dataset.f;
  renderList(f === 'todas' ? events : events.filter(ev => ev.fase === f));
});
</script>

</body>
</html>
