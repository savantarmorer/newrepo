<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <radialGradient id="lux-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5B2C6F" stop-opacity="0"/>
    </radialGradient>
    <filter id="gold-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="umbra-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#5B2C6F"/>
    </linearGradient>
  </defs>

  <!-- 2.1 Lux-Vael — O Guardião da Revelação -->
  <symbol id="seal-lux-vael" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="90" fill="url(#lux-glow)"/>
    <circle cx="100" cy="100" r="85" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="6 3" filter="url(#gold-filter)"/>
    <circle cx="100" cy="100" r="78" fill="none" stroke="#5B2C6F" stroke-width="1.5"/>
    <polygon points="100,30 155,135 45,135" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <polygon points="100,170 45,65 155,65" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4 2"/>
    <path d="M 65 100 Q 100 65 135 100 Q 100 135 65 100 Z" fill="#161426" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="100" cy="100" r="12" fill="#5B2C6F" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="5" fill="#D4AF37"/>
    <line x1="100" y1="10" x2="100" y2="25" stroke="#D4AF37" stroke-width="2"/>
    <line x1="100" y1="175" x2="100" y2="190" stroke="#D4AF37" stroke-width="2"/>
    <line x1="10" y1="100" x2="25" y2="100" stroke="#D4AF37" stroke-width="2"/>
    <line x1="175" y1="100" x2="190" y2="100" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="100" cy="30" r="3" fill="#D4AF37"/>
    <circle cx="155" cy="135" r="3" fill="#D4AF37"/>
    <circle cx="45" cy="135" r="3" fill="#D4AF37"/>
  </symbol>

  <!-- 2.2 Umbra-Kael — O Tecelão do Vazio -->
  <symbol id="seal-umbra-kael" viewBox="0 0 200 200">
    <rect x="10" y="10" width="180" height="180" rx="12" fill="#161426" stroke="#5B2C6F" stroke-width="2"/>
    <path d="M 30 30 L 170 170 M 170 30 L 30 170" stroke="rgba(91, 44, 111, 0.4)" stroke-width="1"/>
    <rect x="40" y="40" width="120" height="120" fill="none" stroke="#FF8C00" stroke-width="1.5" stroke-dasharray="8 4"/>
    <polygon points="100,35 165,100 100,165 35,100" fill="none" stroke="url(#umbra-grad)" stroke-width="2.5"/>
    <circle cx="100" cy="100" r="35" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="18" fill="none" stroke="#FF8C00" stroke-width="1" stroke-dasharray="3 3"/>
    <rect x="92" y="90" width="16" height="20" rx="2" fill="#FF8C00"/>
    <line x1="96" y1="86" x2="104" y2="86" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="100" cy="100" r="3" fill="#161426"/>
  </symbol>

  <!-- 2.3 Chronos-Phanes — O Senhor dos Ciclos -->
  <symbol id="seal-chronos-phanes" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="82" fill="none" stroke="#5B2C6F" stroke-width="4"/>
    <circle cx="100" cy="100" r="74" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="100" cy="26" r="8" fill="#5B2C6F" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="174" cy="100" r="8" fill="#5B2C6F" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="100" cy="174" r="8" fill="#5B2C6F" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="26" cy="100" r="8" fill="#5B2C6F" stroke="#D4AF37" stroke-width="2"/>
    <path d="M 100 100 A 15 15 0 0 1 115 115 A 30 30 0 0 1 85 130 A 45 45 0 0 1 55 85 A 60 60 0 0 1 145 60"
          fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
    <polygon points="145,55 152,65 140,65" fill="#D4AF37"/>
  </symbol>

  <!-- 2.4 Aether-Sophia — A Tecelã do Códice -->
  <symbol id="seal-aether-sophia" viewBox="0 0 200 200">
    <path d="M 100 20 L 165 50 L 165 110 Q 100 180 100 180 Q 100 180 35 110 L 35 50 Z"
          fill="#221F3B" stroke="#D4AF37" stroke-width="2"/>
    <path d="M 55 80 Q 100 90 100 120 Q 100 90 145 80 L 145 130 Q 100 140 100 160 Q 100 140 55 130 Z"
          fill="none" stroke="#D4AF37" stroke-width="2"/>
    <line x1="100" y1="90" x2="100" y2="160" stroke="#5B2C6F" stroke-width="2"/>
    <g transform="translate(100, 55) scale(0.6)">
      <polygon points="0,-25 6,-7 25,0 6,7 0,25 -6,7 -25,0 -6,-7" fill="#D4AF37"/>
      <polygon points="0,-25 6,-7 25,0 6,7 0,25 -6,7 -25,0 -6,-7" fill="#D4AF37" transform="rotate(45)"/>
    </g>
  </symbol>

  <!-- 2.5 Ignis-Architectus — O Forjador da Egrégora -->
  <symbol id="seal-ignis-architectus" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="80" fill="#161426" stroke="#FF8C00" stroke-width="2"/>
    <path d="M 100 30 Q 130 80 150 110 Q 170 140 140 165 Q 100 185 60 165 Q 30 140 50 110 Q 70 80 100 30 Z"
          fill="none" stroke="#FF8C00" stroke-width="2.5"/>
    <path d="M 100 60 Q 120 95 130 120 Q 140 145 120 155 Q 100 165 80 155 Q 60 145 70 120 Q 80 95 100 60 Z"
          fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <rect x="70" y="130" width="60" height="12" rx="3" fill="#5B2C6F" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="100" cy="115" r="8" fill="#D4AF37"/>
  </symbol>

  <!-- 2.6 Noesis-Vesper — A Sentinela do Conselho -->
  <symbol id="seal-noesis-vesper" viewBox="0 0 200 200">
    <polygon points="70,25 130,25 175,70 175,130 130,175 70,175 25,130 25,70"
             fill="#221F3B" stroke="#D4AF37" stroke-width="2"/>
    <line x1="100" y1="50" x2="100" y2="140" stroke="#D4AF37" stroke-width="2.5"/>
    <line x1="55" y1="75" x2="145" y2="75" stroke="#D4AF37" stroke-width="2"/>
    <path d="M 55 75 L 40 110 L 70 110 Z" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <path d="M 145 75 L 130 110 L 160 110 Z" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <rect x="80" y="140" width="40" height="10" rx="2" fill="#5B2C6F" stroke="#D4AF37" stroke-width="1"/>
  </symbol>
</svg>
