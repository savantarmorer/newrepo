<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Ágora — Rito da Soleira</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/cultus.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding: var(--space-6);
    background: radial-gradient(ellipse at 50% 0%, rgba(91,44,111,0.35) 0%, transparent 60%), var(--bg-canvas); }
  .login-card { width: min(420px, 100%); text-align:center; }
  .login-card svg.seal { width:100px; height:100px; margin-bottom: var(--space-4); filter: drop-shadow(0 0 14px rgba(212,175,55,.5)); }
  .oauth-btn { display:flex; align-items:center; justify-content:center; gap:var(--space-3); width:100%; padding: var(--space-4); margin-bottom: var(--space-3); border-radius: var(--radius-sm); font-weight:600; font-size:var(--text-sm); cursor:pointer; border:1px solid transparent; }
  .oauth-btn.discord { background:#5865F2; color:#fff; }
  .oauth-btn.google { background:#fff; color:#111; }
  .oauth-btn:hover { transform: translateY(-1px); }
  #statusMsg { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: var(--space-4); min-height: 16px; }
</style>
</head>
<body>

<div class="card glass login-card">
  <svg class="seal" viewBox="0 0 200 200"><use href="assets/seals.svg#seal-lux-vael"/></svg>
  <h1 style="font-size:var(--text-lg);">Rito da Soleira</h1>
  <p class="text-secondary" style="margin-bottom:var(--space-8); font-size:var(--text-sm);">Atravesse o limiar. Escolha a chave de acesso ao Círculo Interno.</p>

  <button class="oauth-btn discord" onclick="entrarDiscord()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037 19.74 19.74 0 0 0-4.885 1.515.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.073.073 0 0 1 .078.01c.12.099.246.197.373.291a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.106c.36.699.772 1.364 1.225 1.994a.077.077 0 0 0 .084.028 19.84 19.84 0 0 0 6.001-3.03.077.077 0 0 0 .031-.055c.5-5.177-.838-9.674-3.549-13.662a.06.06 0 0 0-.031-.028z"/></svg>
    Entrar com Discord
  </button>

  <button class="oauth-btn google" onclick="entrarGoogle()">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35.4 26.9 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.4C41.5 36 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
    Entrar com Google
  </button>

  <div id="statusMsg"></div>
  <p class="text-muted" style="font-size:var(--text-xs); margin-top:var(--space-6);">Ao entrar, você aceita o Pacto dos Luzes e os estatutos da Ágora (SLU).</p>
  <a href="index.html" class="text-muted" style="font-size:var(--text-xs); display:block; margin-top:var(--space-3);">← Voltar ao Portal</a>
</div>

<script type="module">
import { sb, signInWithDiscord, signInWithGoogle, getSession, registrarLoginDiario, lerErroOAuthDaURL } from './js/agoraAuth.js';

window.entrarDiscord = async () => {
  document.getElementById('statusMsg').textContent = 'Abrindo o portal do Discord...';
  const { error } = await signInWithDiscord();
  if (error) document.getElementById('statusMsg').textContent = 'Erro: ' + error.message;
};

window.entrarGoogle = async () => {
  document.getElementById('statusMsg').textContent = 'Abrindo o portal do Google...';
  const { error } = await signInWithGoogle();
  if (error) document.getElementById('statusMsg').textContent = 'Erro: ' + error.message;
};

// Trata retorno de erro do OAuth (provedor desativado, acesso negado, e-mail já
// registrado com outro provedor, etc.) — pode chegar direto aqui (erro antes do
// redirect) ou repassado por requireAuth() via ?erro= (erro só visível depois
// que o Supabase redirecionou para dashboard.html).
const paramsIniciais = new URLSearchParams(location.search);
const proximaPagina = paramsIniciais.get('next');
const oauthError = lerErroOAuthDaURL() || paramsIniciais.get('erro');
if (oauthError) {
  document.getElementById('statusMsg').textContent = `O ritual foi interrompido: ${oauthError}`;
} else if (paramsIniciais.get('motivo') === 'timeout_oauth') {
  document.getElementById('statusMsg').textContent = 'O Discord respondeu, mas a sessão demorou demais para confirmar. Tente novamente — se persistir, pode ser cache do navegador (tente uma aba anônima).';
}
// Limpa erro/hash/motivo da URL visível, mas preserva "next" para o redirect abaixo.
history.replaceState(null, '', location.pathname + (proximaPagina ? `?next=${encodeURIComponent(proximaPagina)}` : ''));

// Se já houver sessão ativa (ex: retorno do OAuth), registra login e segue
const session = await getSession();
if (session) {
  await registrarLoginDiario(session.user.id);
  window.location.href = proximaPagina || 'perfil.html';
}
</script>

</body>
</html>
